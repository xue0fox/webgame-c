<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>数字速击 · 节奏极限</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: #0a0a12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        .urgency-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .urgency-overlay.active {
            opacity: 1;
            animation: urgencyPulse 0.4s infinite alternate;
        }

        .urgency-overlay.critical {
            opacity: 1;
            animation: urgencyPulseFast 0.2s infinite alternate, screenShake 0.3s infinite;
        }

        @keyframes urgencyPulse {
            0% { box-shadow: inset 0 0 60px rgba(255, 40, 40, 0.15); }
            100% { box-shadow: inset 0 0 120px rgba(255, 40, 40, 0.35); }
        }

        @keyframes urgencyPulseFast {
            0% { box-shadow: inset 0 0 80px rgba(255, 20, 20, 0.25), inset 0 0 0 4px rgba(255, 50, 50, 0.3); }
            100% { box-shadow: inset 0 0 160px rgba(255, 20, 20, 0.55), inset 0 0 0 8px rgba(255, 50, 50, 0.6); }
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            75% { transform: translate(1px, -1px); }
        }

        .heartbeat-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 900;
            color: rgba(255, 40, 40, 0.08);
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.2s;
            letter-spacing: 8px;
        }

        .heartbeat-text.active {
            opacity: 1;
            animation: heartbeat 0.6s infinite;
        }

        .heartbeat-text.critical {
            opacity: 1;
            animation: heartbeatFast 0.3s infinite;
            color: rgba(255, 30, 30, 0.15);
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
        }

        @keyframes heartbeatFast {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 10;
            margin: 0 auto;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .stat-value.target {
            color: #00d9ff;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .stat-value.score {
            color: #f9c74f;
            text-shadow: 0 0 10px rgba(249, 199, 79, 0.3);
        }

        .song-badge {
            text-align: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #888;
        }

        .song-badge span {
            color: #00d9ff;
            font-weight: 700;
        }

        .timer-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 3px;
            transition: width 0.05s linear;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
        }

        .timer-bar.danger {
            background: linear-gradient(90deg, #ff4444, #ff0000);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
            animation: barFlicker 0.1s infinite alternate;
        }

        @keyframes barFlicker {
            0% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
            padding-bottom: 8px;
        }

        .cell {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #b0b8d1;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
            -webkit-touch-callout: none;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .cell:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.1);
        }

        .cell:active::before {
            opacity: 1;
        }

        .cell.correct {
            animation: correctPop 0.25s ease;
            background: rgba(0, 217, 255, 0.15);
            border-color: rgba(0, 217, 255, 0.4);
            color: #00d9ff;
        }

        .cell.wrong {
            animation: wrongShake 0.35s ease;
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.4);
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        @keyframes appear {
            0% { transform: scale(0) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .cell.new-number {
            animation: appear 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
            text-align: center;
        }

        .overlay.hidden {
            display: none !important;
        }

        .overlay-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
            max-width: 300px;
        }

        .final-score {
            font-size: 80px;
            font-weight: 900;
            color: #f9c74f;
            margin: 12px 0;
            text-shadow: 0 0 30px rgba(249, 199, 79, 0.3);
            line-height: 1;
        }

        .final-score-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
            letter-spacing: 2px;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(233, 69, 96, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.15);
            margin-top: 12px;
            box-shadow: none;
            font-size: 14px;
            padding: 12px 32px;
        }

        .btn-secondary:active {
            background: rgba(255,255,255,0.05);
        }

        .combo-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #f9c74f;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            text-shadow: 0 0 20px rgba(249, 199, 79, 0.5);
        }

        .combo-text.show {
            animation: comboAnim 0.8s ease forwards;
        }

        @keyframes comboAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        .rules {
            text-align: left;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #888;
            line-height: 1.7;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .rules strong {
            color: #bbb;
        }

        .rules li {
            margin-left: 16px;
            margin-bottom: 3px;
        }

        .mute-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 200;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #888;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-user-select: none;
            user-select: none;
        }

        .mute-btn.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rules">
        <strong>节奏极限模式：</strong>
        <ul style="list-style: none; padding: 0; margin-top: 6px;">
            <li>• 30个格子随机排列数字，从 1 开始按顺序点击</li>
            <li>• <strong>没有提示</strong>，全靠眼力在格子中寻找目标</li>
            <li>• 每点击正确一次，该格子会更新为更大的新数字</li>
            <li>• 所有数字全局唯一，已出现过的不会重复</li>
            <li>• 初始 <strong>5秒</strong>，每完成10个数字时间减少 <strong>10%</strong></li>
            <li>• 每局随机一首歌曲，按顺序点击数字即可演奏完整旋律</li>
            <li>• 超时未点击则游戏结束，统计最终数字</li>

</div>

<script>

    var TOTAL_CELLS = 30;
    var BASE_TIME = 5000;

    // ===== 歌曲库：每首是完整的音符序列（MIDI编号） =====
    var SONGS = [

        },

        }
    ];

    // ===== 游戏状态 =====
    var cells = [];
    var currentTarget = 1;
    var nextNumber = 31;
    var timerStart = 0;
    var timerId = null;

    try { bestScore = parseInt(localStorage.getItem('numberTapBestV2')) || 0; } catch(e) {}

    var gridEl = document.getElementById('grid');
    var targetDisplay = document.getElementById('targetDisplay');
    var scoreDisplay = document.getElementById('scoreDisplay');

    // ===== 音频 =====
    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch(e) {}
    }

    function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // 获取数字N对应的歌曲音符（歌曲循环播放）
    function noteForTarget(n) {
        if (!currentSong || !currentSong.notes.length) return 440;
        var idx = (n - 1) % currentSong.notes.length;
        return midiToFreq(currentSong.notes[idx]);
    }

    function playTone(num, type) {
        if (isMuted || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            var now = audioCtx.currentTime;
            if (type === 'correct') {
                var f = noteForTarget(num);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 1.005, now + 0.1);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, now);
                osc.frequency.linearRampToValueAtTime(70, now + 0.25);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.7);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                osc.start(now);
                osc.stop(now + 0.9);
            }
        } catch(e) {}
    }

    // ===== 工具 =====
    function getTimeLimit() {
        var done = currentTarget - 1;
        var tier = Math.floor(done / 10);
        return BASE_TIME * Math.pow(0.9, tier);
    }

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
        }
        return a;
    }

    // ===== 格子点击 =====
    function cellClick(index) {
        if (!isPlaying) return;

        var clickedNum = cells[index];
        var cellEl = gridEl.children[index];

        if (clickedNum === currentTarget) {
            combo++;
            if (combo >= 5 && combo % 5 === 0) {
                comboTextEl.textContent = combo + ' 连击!';
                comboTextEl.classList.remove('show');
                void comboTextEl.offsetWidth;
                comboTextEl.classList.add('show');
            }

            playTone(currentTarget, 'correct');

            cells[index] = nextNumber++;
            currentTarget++;

            cellEl.textContent = cells[index];
            cellEl.classList.add('correct');
            cellEl.classList.add('new-number');
            setTimeout(function() {
                cellEl.classList.remove('correct');
                cellEl.classList.remove('new-number');
            }, 300);

            updateDisplay();
            startTimer();
        } else {
            combo = 0;
            playTone(0, 'wrong');
            cellEl.classList.add('wrong');
            setTimeout(function() {
                cellEl.classList.remove('wrong');
            }, 400);
        }
    }

    // ===== 开始游戏 =====
    function startGame() {
        initAudio();

        startOverlay.classList.add('hidden');
        startOverlay.style.display = 'none';
        endOverlay.classList.add('hidden');
        endOverlay.style.display = 'none';
        gameContainer.style.display = 'flex';
        muteBtn.classList.remove('hidden');

        currentTarget = 1;
        nextNumber = TOTAL_CELLS + 1;
        combo = 0;
        isPlaying = true;

        urgencyOverlay.className = 'urgency-overlay';
        heartbeatText.className = 'heartbeat-text';

        // 随机选一首完整歌曲
        currentSong = SONGS[Math.floor(Math.random() * SONGS.length)];
        songNameEl.textContent = currentSong.name;
        songBadge.style.display = 'block';

        var nums = [];
        for (var i = 0; i < TOTAL_CELLS; i++) nums.push(i + 1);
        cells = shuffle(nums);

        var children = gridEl.children;
        for (var i = 0; i < TOTAL_CELLS; i++) {
            children[i].textContent = cells[i];
            children[i].className = 'cell';
        }

        updateDisplay();
        startTimer();
    }

    function updateDisplay() {
        targetDisplay.textContent = currentTarget;
        scoreDisplay.textContent = Math.max(bestScore, currentTarget - 1);
        var reached = currentTarget - 1;
        if (reached > bestScore) {
            bestScore = reached;
            try { localStorage.setItem('numberTapBestV2', bestScore); } catch(e) {}
        }
    }

    function startTimer() {
        if (timerId) cancelAnimationFrame(timerId);
        timerStart = performance.now();
        urgencyOverlay.className = 'urgency-overlay';
        heartbeatText.className = 'heartbeat-text';
        timerBar.classList.remove('danger');
        tick();
    }

    function tick() {
        if (!isPlaying) return;

        var limit = getTimeLimit();
        var elapsed = performance.now() - timerStart;
        var remaining = Math.max(0, limit - elapsed);
        var progress = remaining / limit;

        timerBar.style.width = (progress * 100) + '%';
        timeDisplay.textContent = (remaining / 1000).toFixed(1) + 's';

        if (progress < 0.2) {
            urgencyOverlay.className = 'urgency-overlay critical';
            heartbeatText.className = 'heartbeat-text critical';
            heartbeatText.textContent = Math.ceil(remaining / 1000).toString();
            timerBar.classList.add('danger');
        } else if (progress < 0.5) {
            urgencyOverlay.className = 'urgency-overlay active';
            heartbeatText.className = 'heartbeat-text active';
            heartbeatText.textContent = 'HURRY';
            timerBar.classList.remove('danger');
        } else {
            urgencyOverlay.className = 'urgency-overlay';
            heartbeatText.className = 'heartbeat-text';
            timerBar.classList.remove('danger');
        }

        if (remaining <= 0) {
            gameOver();
        } else {
            timerId = requestAnimationFrame(tick);
        }
    }

    function gameOver() {
        isPlaying = false;
        if (timerId) cancelAnimationFrame(timerId);

        playTone(0, 'gameover');

        urgencyOverlay.className = 'urgency-overlay';
        heartbeatText.className = 'heartbeat-text';

        var final = currentTarget - 1;
        finalScoreEl.textContent = final;

        if (final < 30) finalCommentEl.textContent = '眼疾手快，再试一次！';
        else if (final < 50) finalCommentEl.textContent = '不错不错，反应很快！';
        else if (final < 80) finalCommentEl.textContent = '太厉害了，高手！';
        else if (final < 120) finalCommentEl.textContent = '惊人的速度，大神！';
        else finalCommentEl.textContent = '超越极限，你是传说！';

        if (currentSong) {
            finalSongEl.textContent = '🎵 伴随旋律：' + currentSong.name;
        }

        endOverlay.classList.remove('hidden');
        endOverlay.style.display = '';
    }

    function showStart() {
        endOverlay.classList.add('hidden');
        endOverlay.style.display = 'none';
        startOverlay.classList.remove('hidden');
        startOverlay.style.display = '';
        gameContainer.style.display = 'none';
        muteBtn.classList.add('hidden');
    }

    function toggleMute() {
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? '🔇' : '🔊';
    }
</script>

</body>
</html>

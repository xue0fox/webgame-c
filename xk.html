<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌌 浪漫星河 · 从太阳系望向宇宙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; }

        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .hint span { opacity: 0.5; }

        .coords {
            position: fixed;
            top: 20px;
            right: 24px;
            color: rgba(255,255,255,0.08);
            font-size: 11px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status {
            position: fixed;
            top: 20px;
            left: 24px;
            color: rgba(255,255,255,0.10);
            font-size: 11px;
            font-weight: 300;
            z-index: 10;
            pointer-events: none;
            line-height: 1.8;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status .loaded { color: rgba(255,255,255,0.2); }

        @media (max-width: 600px) {
            .hint { font-size: 10px; padding: 6px 14px; bottom: 16px; white-space: normal; }
            .coords { display: none; }
            .status { top: 12px; left: 16px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="hint">✦ <span>拖拽旋转 · 滚轮缩放 · WASD飞行 · Shift加速</span></div>
    <div class="coords" id="coords">∞ · ∞ · ∞</div>
    <div class="status">
        <div class="loaded" id="starCount">✦ 星海加载中 ...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. 导入
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. 场景
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010106);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0); // 太阳系中心

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. 控制器
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1;
        controls.maxDistance = 800;
        controls.zoomSpeed = 0.6;
        controls.rotateSpeed = 0.25;
        controls.update();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. 星星纹理 (带柔和光晕)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function makeStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.1, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.6, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTex = makeStarTexture();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. 华丽星云纹理生成器 (彩色渐变)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createNebulaTexture(color1, color2, color3) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // 主渐变
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, `rgba(${color1[0]*255},${color1[1]*255},${color1[2]*255},1)`);
            grad.addColorStop(0.3, `rgba(${color2[0]*255},${color2[1]*255},${color2[2]*255},0.7)`);
            grad.addColorStop(0.7, `rgba(${color3[0]*255},${color3[1]*255},${color3[2]*255},0.3)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            // 加入一些噪声纹理
            const imageData = ctx.getImageData(0, 0, 256, 256);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 15;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imageData, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. 构建彩色星云 (大尺寸精灵环绕天空)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createNebulaSprites() {
            const group = new THREE.Group();

            // 定义星云颜色组合 (RGB 0-1)
            const palettes = [
                { c1: [0.8, 0.2, 0.6], c2: [0.4, 0.1, 0.8], c3: [0.1, 0.1, 0.3] }, // 紫红
                { c1: [0.2, 0.6, 0.9], c2: [0.1, 0.3, 0.8], c3: [0.0, 0.1, 0.2] }, // 蓝
                { c1: [0.9, 0.5, 0.2], c2: [0.8, 0.2, 0.1], c3: [0.3, 0.1, 0.0] }, // 橙红
                { c1: [0.1, 0.9, 0.6], c2: [0.0, 0.5, 0.4], c3: [0.0, 0.2, 0.1] }, // 青绿
                { c1: [0.9, 0.2, 0.9], c2: [0.6, 0.1, 0.6], c3: [0.2, 0.0, 0.2] }, // 品紫
                { c1: [1.0, 0.8, 0.3], c2: [0.9, 0.5, 0.1], c3: [0.4, 0.2, 0.0] }, // 金
                { c1: [0.3, 0.7, 1.0], c2: [0.1, 0.4, 0.9], c3: [0.0, 0.1, 0.3] }, // 亮蓝
                { c1: [0.9, 0.3, 0.4], c2: [0.7, 0.1, 0.3], c3: [0.2, 0.0, 0.1] }, // 玫瑰
            ];

            // 分布在半径为 150~400 光年的球面上
            const count = 12;
            for (let i = 0; i < count; i++) {
                const palette = palettes[i % palettes.length];
                const texture = createNebulaTexture(palette.c1, palette.c2, palette.c3);
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: 0.7 + Math.random() * 0.2,
                });
                const sprite = new THREE.Sprite(material);
                // 随机方向
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const dist = 120 + Math.random() * 300;
                sprite.position.set(
                    dist * Math.sin(phi) * Math.cos(theta),
                    dist * Math.cos(phi) * 0.6, // 略扁平
                    dist * Math.sin(phi) * Math.sin(theta)
                );
                // 随机大小
                const size = 40 + Math.random() * 120;
                sprite.scale.set(size, size, 1);
                // 随机旋转 (不可见，但留着)
                sprite.userData = { rotSpeed: (Math.random() - 0.5) * 0.0002 };
                group.add(sprite);
            }

            // 额外增加几个更亮、更近的星云 (增强华丽感)
            for (let i = 0; i < 6; i++) {
                const palette = palettes[(i+3) % palettes.length];
                const texture = createNebulaTexture(palette.c1, palette.c2, palette.c3);
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: 0.5 + Math.random() * 0.3,
                });
                const sprite = new THREE.Sprite(material);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const dist = 60 + Math.random() * 150;
                sprite.position.set(
                    dist * Math.sin(phi) * Math.cos(theta),
                    dist * Math.cos(phi) * 0.5,
                    dist * Math.sin(phi) * Math.sin(theta)
                );
                const size = 30 + Math.random() * 80;
                sprite.scale.set(size, size, 1);
                group.add(sprite);
            }

            return group;
        }

        const nebulaGroup = createNebulaSprites();
        scene.add(nebulaGroup);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. 银河光晕 (巨大的半透明圆盘)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createMilkyWayGlow() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            // 绘制一个扁平的椭圆渐变，模拟银河盘
            const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            grad.addColorStop(0, 'rgba(255, 240, 200, 0.4)');
            grad.addColorStop(0.2, 'rgba(200, 180, 255, 0.3)');
            grad.addColorStop(0.5, 'rgba(100, 120, 255, 0.15)');
            grad.addColorStop(0.8, 'rgba(50, 60, 150, 0.05)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(256, 256, 240, 80, 0, 0, Math.PI * 2);
            ctx.fill();

            // 添加一些星点
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 512;
                const y = 128 + Math.random() * 256;
                const r = Math.random() * 3;
                const alpha = Math.random() * 0.4;
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({
                map: texture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.6,
            });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(0, 0, 0);
            sprite.scale.set(600, 200, 1);
            // 旋转使其平躺 (但我们希望它垂直于视线？实际应该放在远处环绕，但这里作为背景)
            // 让它平躺于XZ平面，但相机在原点，所以它会形成环绕效果
            sprite.rotation.x = Math.PI / 2;
            return sprite;
        }

        // 将银河光晕放在较远位置，而不是原点，这样看起来像背景
        function createMilkyWayBackground() {
            const group = new THREE.Group();
            // 创建两个半透明的银河盘，分开放置，产生环绕感
            const positions = [
                { x: 0, y: 0, z: -300, rot: 0 },
                { x: 0, y: 0, z: 300, rot: Math.PI },
                { x: -250, y: 0, z: 0, rot: Math.PI/2 },
                { x: 250, y: 0, z: 0, rot: -Math.PI/2 },
            ];
            for (const pos of positions) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
                grad.addColorStop(0, 'rgba(255, 235, 200, 0.2)');
                grad.addColorStop(0.3, 'rgba(200, 200, 255, 0.15)');
                grad.addColorStop(0.7, 'rgba(100, 120, 255, 0.05)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(256, 256, 200, 70, 0, 0, Math.PI * 2);
                ctx.fill();
                // 添加星点
                for (let i = 0; i < 200; i++) {
                    const x = Math.random() * 512;
                    const y = 150 + Math.random() * 212;
                    const r = Math.random() * 2;
                    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.3})`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: 0.5,
                });
                const sprite = new THREE.Sprite(material);
                sprite.position.set(pos.x, pos.y, pos.z);
                sprite.scale.set(400, 140, 1);
                sprite.rotation.x = Math.PI / 2;
                sprite.rotation.z = pos.rot;
                group.add(sprite);
            }
            return group;
        }

        const milkyWay = createMilkyWayBackground();
        scene.add(milkyWay);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. 恒星系统 (精致粒子)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 内置亮星 (真实坐标)
        const BRIGHT_STARS = [
            ['天狼星', -2.64, -1.37, -7.79, -1.44, 'A1'],
            ['织女星', 16.73, 24.08, 10.67, 0.03, 'A0'],
            ['大角星', -8.62, 19.83, 11.16, -0.05, 'K1'],
            ['参宿四', 223.28, -39.71, 187.08, 0.50, 'M2'],
            ['参宿七', 396.93, -90.90, 592.15, 0.12, 'B8'],
            ['五车二', 10.34, 7.83, 40.63, 0.08, 'G5'],
            ['南河三', -1.99, -1.18, -11.33, 0.34, 'F5'],
            ['牛郎星', 11.67, 8.15, -4.63, 0.76, 'A7'],
            ['心宿二', 302.07, -159.49, 313.75, 0.96, 'M1'],
            ['天津四', 933.75, 1083.89, 1011.97, 1.25, 'A2'],
            ['北河三', 10.33, 6.75, 27.70, 1.14, 'K0'],
            ['角宿一', 77.89, -123.76, 182.88, 0.98, 'B1'],
            ['毕宿五', -25.57, -36.08, 48.28, 0.85, 'K5'],
            ['北极星', 124.48, 198.49, 321.10, 1.97, 'F7'],
            ['半人马座α', -0.04, -0.17, -4.37, -0.01, 'G2'],
            ['比邻星', -0.46, -0.04, -4.24, 11.05, 'M5'],
            ['巴纳德星', -1.18, 1.52, -5.22, 9.54, 'M4'],
            ['天仓五', 3.03, 0.90, -11.22, 3.50, 'G8'],
            ['天苑四', 0.99, -3.72, -10.32, 3.73, 'K2'],
        ];

        function spectToColor(spect) {
            const s = spect.trim().toUpperCase();
            if (s.startsWith('O')) return [0.7, 0.7, 1.0];
            if (s.startsWith('B')) return [0.8, 0.8, 1.0];
            if (s.startsWith('A')) return [0.9, 0.9, 1.0];
            if (s.startsWith('F')) return [1.0, 1.0, 0.9];
            if (s.startsWith('G')) return [1.0, 0.95, 0.8];
            if (s.startsWith('K')) return [1.0, 0.8, 0.6];
            if (s.startsWith('M')) return [1.0, 0.6, 0.4];
            return [0.9, 0.9, 0.9];
        }

        // 生成背景恒星 (颜色丰富)
        function generateBackgroundStars(count = 6000) {
            const stars = [];
            const types = [
                { spect: 'O', weight: 0.001 },
                { spect: 'B', weight: 0.01 },
                { spect: 'A', weight: 0.05 },
                { spect: 'F', weight: 0.15 },
                { spect: 'G', weight: 0.25 },
                { spect: 'K', weight: 0.35 },
                { spect: 'M', weight: 0.189 },
            ];
            const total = types.reduce((s, t) => s + t.weight, 0);
            const cum = [];
            let acc = 0;
            for (const t of types) { acc += t.weight; cum.push(acc); }

            for (let i = 0; i < count; i++) {
                const d = 5 + Math.pow(Math.random(), 1.6) * 600;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = d * Math.sin(phi) * Math.cos(theta);
                const y = d * Math.cos(phi);
                const z = d * Math.sin(phi) * Math.sin(theta);
                const rand = Math.random() * total;
                let spect = 'G';
                for (let j = 0; j < cum.length; j++) {
                    if (rand <= cum[j]) { spect = types[j].spect; break; }
                }
                const mag = 3 + Math.log10(d) * 2 + (Math.random() - 0.5) * 3;
                stars.push({ x, y, z, mag, spect });
            }
            return stars;
        }

        const brightData = BRIGHT_STARS.map(([name, x, y, z, mag, spect]) => ({ x, y, z, mag, spect }));
        const bgData = generateBackgroundStars(5000);
        const allStars = [...brightData, ...bgData];

        document.getElementById('starCount').textContent = `✦ 恒星: ${allStars.length.toLocaleString()}  · 星云: 18`;

        function createStarField(starData) {
            const count = starData.length;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const star = starData[i];
                positions[i*3] = star.x;
                positions[i*3+1] = star.y;
                positions[i*3+2] = star.z;

                const col = spectToColor(star.spect);
                const r = Math.max(0.2, Math.min(1, col[0] + (Math.random() - 0.5) * 0.1));
                const g = Math.max(0.2, Math.min(1, col[1] + (Math.random() - 0.5) * 0.1));
                const b = Math.max(0.2, Math.min(1, col[2] + (Math.random() - 0.5) * 0.1));
                colors[i*3] = r;
                colors[i*3+1] = g;
                colors[i*3+2] = b;

                const brightness = Math.pow(10, -star.mag / 5);
                sizes[i] = 0.015 + brightness * 0.4;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            return new THREE.Points(geom, mat);
        }

        const starField = createStarField(allStars);
        scene.add(starField);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. 键盘控制
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = true;
            if (k === 'shift') keys.shift = true;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = false;
            if (k === 'shift') keys.shift = false;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('blur', () => {
            keys.w = keys.s = keys.a = keys.d = keys.shift = false;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. 动画循环
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const speedBase = 0.12;
        let velocity = new THREE.Vector3(0, 0, 0);
        const coordsEl = document.getElementById('coords');

        function animate() {
            requestAnimationFrame(animate);

            // 星云缓慢旋转
            nebulaGroup.children.forEach((sprite, index) => {
                if (sprite.userData.rotSpeed) {
                    sprite.rotation.z += sprite.userData.rotSpeed;
                }
            });

            // 银河光晕缓慢旋转
            milkyWay.children.forEach((sprite) => {
                sprite.rotation.z += 0.0001;
            });

            // 移动控制
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let speed = speedBase * (keys.shift ? 2.2 : 1.0);
            let moveX = 0, moveZ = 0;
            if (keys.w) moveZ += speed;
            if (keys.s) moveZ -= speed;
            if (keys.a) moveX -= speed * 0.7;
            if (keys.d) moveX += speed * 0.7;

            const target = new THREE.Vector3();
            if (moveZ !== 0) target.add(forward.clone().multiplyScalar(moveZ));
            if (moveX !== 0) target.add(right.clone().multiplyScalar(moveX));

            velocity.lerp(target, 0.08);
            if (velocity.length() < 0.001 && target.length() === 0) velocity.set(0,0,0);

            if (velocity.length() > 0.0001) {
                camera.position.add(velocity);
                controls.target.add(velocity);
            }

            controls.update();

            const p = camera.position;
            coordsEl.textContent = `${p.x.toFixed(1)} · ${p.y.toFixed(1)} · ${p.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        animate();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 11. 响应式
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌌 浪漫星河已展开 — 绚丽的星云与银河');
    </script>
</body>
</html>

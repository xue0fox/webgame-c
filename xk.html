<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>三阶魔方还原指导 - 3D</title>
    <style>
        /* ===== 全局重置 & 自适应 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* ===== 3D 容器 ===== */
        #canvas-container {
            flex: 1;
            min-height: 0;
            position: relative;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1f 100%);
            touch-action: none;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ===== 顶部状态栏 ===== */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        #header>* {
            pointer-events: auto;
        }
        #title {
            font-size: clamp(14px, 3vw, 24px);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        #step-indicator {
            font-size: clamp(12px, 2.2vw, 18px);
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #step-indicator span {
            color: #ffd700;
            font-weight: 700;
        }

        /* ===== 底部控制面板 ===== */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px 20px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        #controls>* {
            pointer-events: auto;
        }

        /* 步骤描述 */
        #step-description {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(14px, 2.5vw, 20px);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== 颜色选择器 ===== */
        #color-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .color-swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 12px;
            transition: all 0.2s;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            min-width: 44px;
        }
        .color-swatch.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.05);
        }
        .color-swatch .color-box {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .color-swatch .count {
            font-size: clamp(10px, 1.6vw, 14px);
            font-weight: 600;
            color: #ccc;
            background: rgba(0, 0, 0, 0.4);
            padding: 0 6px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }
        .color-swatch .count.done {
            color: #4caf50;
        }
        .color-swatch .count.full {
            color: #f44336;
        }
        .color-swatch.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .color-swatch .color-box {
                width: 26px;
                height: 26px;
            }
            .color-swatch {
                min-width: 36px;
                padding: 2px 4px;
            }
            #color-picker {
                gap: 4px;
                padding: 6px 8px;
            }
        }

        /* 按钮行 */
        #button-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        #button-row button {
            flex: 1;
            min-width: 70px;
            max-width: 200px;
            padding: 12px 8px;
            border: none;
            border-radius: 14px;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        #button-row button:active {
            transform: scale(0.94);
        }
        #btn-prev {
            background: rgba(255, 255, 255, 0.12);
            color: #ccc;
        }
        #btn-prev:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }
        #btn-prev:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #btn-next {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        #btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 210, 0, 0.3);
        }
        #btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        #btn-reset {
            background: rgba(255, 70, 70, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.2);
        }
        #btn-reset:hover {
            background: rgba(255, 70, 70, 0.3);
        }

        /* ===== 加载遮罩 ===== */
        #overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.6s ease;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #overlay .msg {
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
            color: #eee;
        }
        #overlay .sub {
            font-size: clamp(12px, 2vw, 16px);
            color: #aaa;
            text-align: center;
            padding: 0 20px;
        }

        /* ===== Toast ===== */
        #toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 28px;
            border-radius: 30px;
            font-size: clamp(13px, 2.2vw, 18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s ease;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式调整 ===== */
        @media (max-width: 600px) {
            #header {
                padding: 8px 12px;
            }
            #controls {
                padding: 8px 10px 14px;
            }
            #step-description {
                padding: 10px 14px;
                min-height: 48px;
                font-size: 13px;
                border-radius: 12px;
            }
            #button-row button {
                padding: 10px 6px;
                font-size: 13px;
                border-radius: 12px;
                min-width: 60px;
            }
        }
        @media (max-width: 400px) {
            #step-description {
                font-size: 12px;
                min-height: 40px;
                padding: 8px 10px;
            }
            #button-row button {
                font-size: 11px;
                padding: 8px 4px;
                min-width: 50px;
            }
            #title {
                font-size: 12px;
                padding: 2px 10px;
            }
            #step-indicator {
                font-size: 11px;
                padding: 2px 10px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- 3D 容器 -->
        <div id="canvas-container"></div>

        <!-- 顶部 -->
        <div id="header">
            <div id="title">🧩 魔方还原</div>
            <div id="step-indicator">步骤 <span id="step-num">0</span> / <span id="step-total">0</span></div>
        </div>

        <!-- 底部控制 -->
        <div id="controls">
            <div id="step-description">👆 先选择颜色，再点击魔方小面涂色</div>

            <!-- 颜色选择器 -->
            <div id="color-picker">
                <!-- 由 JS 动态生成 -->
            </div>

            <div id="button-row">
                <button id="btn-prev" disabled>⬅ 上一步</button>
                <button id="btn-next" disabled>🚀 开始还原</button>
                <button id="btn-reset">🔄 重置</button>
            </div>
        </div>

        <!-- 遮罩 -->
        <div id="overlay">
            <div class="spinner"></div>
            <div class="msg">⏳ 加载中...</div>
            <div class="sub">正在初始化魔方</div>
        </div>

        <!-- Toast -->
        <div id="toast"></div>
    </div>

    <!-- ===================== 引入 Three.js ===================== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <!-- ===================== 主程序 ===================== -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================================
        //  1. 配置 & 常量
        // ============================================================
        const FACE_NAMES = ['上', '下', '左', '右', '前', '后'];
        const FACE_COLORS = [
            0xffffff, // 白
            0xffff00, // 黄
            0xff8c00, // 橙
            0xff0000, // 红
            0x00cc44, // 绿
            0x0066ff, // 蓝
        ];
        const COLOR_HEX_STR = FACE_COLORS.map(c => '#' + c.toString(16).padStart(6, '0'));
        const COLOR_NAMES = ['白', '黄', '橙', '红', '绿', '蓝'];

        // 面的法线方向
        const FACE_NORMALS = [
            new THREE.Vector3(0, 1, 0),
            new THREE.Vector3(0, -1, 0),
            new THREE.Vector3(-1, 0, 0),
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(0, 0, 1),
            new THREE.Vector3(0, 0, -1),
        ];

        // ============================================================
        //  2. 状态管理
        // ============================================================
        let cubeState = []; // 6x9 颜色索引
        let userColors = []; // 用户设置的颜色 (6x9)
        let solveSteps = [];
        let currentStepIndex = -1;
        let isSolving = false;
        let isAnimating = false;

        // 颜色计数: 每种颜色已使用的数量 (初始均为0)
        let colorUsed = [0, 0, 0, 0, 0, 0];
        // 当前选中的颜色索引
        let selectedColorIndex = 0;

        // Three.js 对象
        let scene, camera, renderer, controls;
        let cubeGroup;
        let stickerMeshes = [];
        let stickerData = []; // { mesh, face, row, col, colorIndex }
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // DOM 元素
        const container = document.getElementById('canvas-container');
        const overlay = document.getElementById('overlay');
        const stepNumEl = document.getElementById('step-num');
        const stepTotalEl = document.getElementById('step-total');
        const stepDescEl = document.getElementById('step-description');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnReset = document.getElementById('btn-reset');
        const toastEl = document.getElementById('toast');
        const colorPickerEl = document.getElementById('color-picker');

        // ============================================================
        //  3. Three.js 初始化
        // ============================================================
        function initScene() {
            const rect = container.getBoundingClientRect();
            const w = rect.width || window.innerWidth;
            const h = rect.height || window.innerHeight;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
            camera.position.set(5, 4, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.autoRotate = false;
            controls.enableZoom = true;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.0;
            controls.target.set(0, 0, 0);
            controls.update();

            // 灯光
            const ambient = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(8, 12, 6);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
            fillLight.position.set(-5, 3, -8);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
            rimLight.position.set(0, -6, 4);
            scene.add(rimLight);

            const gridHelper = new THREE.GridHelper(12, 20, 0x8888ff, 0x444466);
            gridHelper.position.y = -2.2;
            scene.add(gridHelper);

            window.addEventListener('resize', onResize);
            animate();
        }

        function onResize() {
            const rect = container.getBoundingClientRect();
            const w = rect.width || window.innerWidth;
            const h = rect.height || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================================
        //  4. 魔方构建
        // ============================================================
        function buildCube(colors) {
            // colors: 6x9 颜色索引
            if (cubeGroup) {
                scene.remove(cubeGroup);
                cubeGroup = null;
                stickerMeshes = [];
                stickerData = [];
            }

            cubeGroup = new THREE.Group();
            const size = 1;
            const gap = 0.05;
            const half = size / 2;
            const stickerSize = 0.85;
            const stickerOffset = 0.001;

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const faces = [];
                        if (y === 1) faces.push({ face: 0, row: 2 - (z + 1), col: x + 1 });
                        if (y === -1) faces.push({ face: 1, row: z + 1, col: x + 1 });
                        if (x === -1) faces.push({ face: 2, row: 2 - (y + 1), col: z + 1 });
                        if (x === 1) faces.push({ face: 3, row: 2 - (y + 1), col: 2 - (z + 1) });
                        if (z === 1) faces.push({ face: 4, row: 2 - (y + 1), col: x + 1 });
                        if (z === -1) faces.push({ face: 5, row: 2 - (y + 1), col: 2 - (x + 1) });

                        if (faces.length === 0) continue;

                        const geo = new THREE.BoxGeometry(size - gap, size - gap, size - gap);
                        const mat = new THREE.MeshStandardMaterial({
                            color: 0x222222,
                            roughness: 0.6,
                            metalness: 0.1,
                        });
                        const cube = new THREE.Mesh(geo, mat);
                        cube.position.set(x, y, z);
                        cube.castShadow = true;
                        cube.receiveShadow = true;

                        for (const f of faces) {
                            const ci = colors[f.face][f.row * 3 + f.col];
                            const colorHex = FACE_COLORS[ci] || 0x444444;
                            const stickerMat = new THREE.MeshStandardMaterial({
                                color: colorHex,
                                roughness: 0.3,
                                metalness: 0.05,
                                emissive: colorHex,
                                emissiveIntensity: 0.05,
                            });

                            const normal = FACE_NORMALS[f.face].clone();
                            const q = new THREE.Quaternion().setFromUnitVectors(
                                new THREE.Vector3(0, 0, 1),
                                normal
                            );

                            const stickerGeo = new THREE.PlaneGeometry(stickerSize, stickerSize);
                            const sticker = new THREE.Mesh(stickerGeo, stickerMat);
                            sticker.position.set(x, y, z).add(normal.clone().multiplyScalar(half + stickerOffset));
                            sticker.quaternion.copy(q);
                            sticker.castShadow = false;
                            sticker.receiveShadow = false;

                            const data = {
                                mesh: sticker,
                                face: f.face,
                                row: f.row,
                                col: f.col,
                                colorIndex: ci,
                                cubePos: new THREE.Vector3(x, y, z),
                            };
                            stickerData.push(data);
                            stickerMeshes.push(sticker);
                            cubeGroup.add(sticker);
                        }

                        cubeGroup.add(cube);
                    }
                }
            }

            scene.add(cubeGroup);
            cubeState = colors.map(face => [...face]);
            // 更新颜色计数
            updateColorCounts();
        }

        // ============================================================
        //  5. 颜色计数 & UI 更新
        // ============================================================
        function updateColorCounts() {
            colorUsed = [0, 0, 0, 0, 0, 0];
            for (const d of stickerData) {
                colorUsed[d.colorIndex]++;
            }
            renderColorPicker();
        }

        function renderColorPicker() {
            let html = '';
            for (let i = 0; i < 6; i++) {
                const used = colorUsed[i];
                const remaining = 9 - used;
                const isFull = remaining <= 0;
                const activeClass = (i === selectedColorIndex) ? 'active' : '';
                const disabledClass = isFull ? 'disabled' : '';
                const countClass = remaining === 0 ? 'full' : (remaining <= 3 ? 'done' : '');
                html += `
                    <div class="color-swatch ${activeClass} ${disabledClass}" data-index="${i}">
                        <div class="color-box" style="background:${COLOR_HEX_STR[i]};"></div>
                        <span class="count ${countClass}">${remaining}</span>
                    </div>
                `;
            }
            colorPickerEl.innerHTML = html;

            // 绑定点击事件
            colorPickerEl.querySelectorAll('.color-swatch').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    if (colorUsed[idx] >= 9) {
                        showToast('该颜色已用完！', 800);
                        return;
                    }
                    selectedColorIndex = idx;
                    renderColorPicker();
                });
                // 触摸优化
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const idx = parseInt(el.dataset.index);
                    if (colorUsed[idx] >= 9) {
                        showToast('该颜色已用完！', 800);
                        return;
                    }
                    selectedColorIndex = idx;
                    renderColorPicker();
                }, { passive: false });
            });
        }

        // ============================================================
        //  6. 颜色设置交互 (点击小面)
        // ============================================================
        function setupColorPickerEvents() {
            if (!renderer || !renderer.domElement) {
                console.error('Renderer not available');
                return;
            }
            renderer.domElement.addEventListener('click', onCanvasClick);
            renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: true });
        }

        let touchStartPos = { x: 0, y: 0 };

        function onTouchStart(e) {
            const touch = e.touches[0];
            touchStartPos.x = touch.clientX;
            touchStartPos.y = touch.clientY;
        }

        renderer?.domElement?.addEventListener('touchend', (e) => {
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartPos.x;
            const dy = touch.clientY - touchStartPos.y;
            if (Math.sqrt(dx * dx + dy * dy) < 10) {
                const rect = renderer.domElement.getBoundingClientRect();
                const x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
                handleCanvasClick(x, y);
            }
        }, { passive: true });

        function onCanvasClick(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            handleCanvasClick(x, y);
        }

        function handleCanvasClick(x, y) {
            if (isAnimating || isSolving) return;
            // 如果在步骤模式，不允许修改颜色
            if (solveSteps.length > 0 && currentStepIndex >= 0) {
                return;
            }

            mouse.set(x, y);
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(stickerMeshes);
            if (intersects.length === 0) return;

            const hit = intersects[0].object;
            const data = stickerData.find(d => d.mesh === hit);
            if (!data) return;

            const oldColor = data.colorIndex;
            const newColor = selectedColorIndex;

            if (oldColor === newColor) {
                showToast('已经是该颜色', 600);
                return;
            }

            // 检查新颜色是否还有剩余
            if (colorUsed[newColor] >= 9) {
                showToast('该颜色已用完！', 800);
                return;
            }

            // 更新贴纸颜色
            data.colorIndex = newColor;
            data.mesh.material.color.setHex(FACE_COLORS[newColor]);
            data.mesh.material.emissive.setHex(FACE_COLORS[newColor]);

            // 更新状态
            const fi = data.face;
            const idx = data.row * 3 + data.col;
            cubeState[fi][idx] = newColor;
            userColors[fi][idx] = newColor;

            // 更新计数
            colorUsed[oldColor]--;
            colorUsed[newColor]++;

            // 刷新颜色选择器
            renderColorPicker();

            // 自动切换到下一个颜色（可选），但不强制
            // 显示反馈
            showToast(`${COLOR_NAMES[newColor]} +1`, 400);
        }

        // ============================================================
        //  7. 还原算法 (演示)
        // ============================================================
        function computeSolveSteps(state) {
            const steps = [];
            if (isSolved(state)) return steps;

            // 演示步骤
            const demoMoves = [
                { move: 'R', desc: '右面顺时针旋转 90°' },
                { move: 'U', desc: '顶面顺时针旋转 90°' },
                { move: 'R\'', desc: '右面逆时针旋转 90°' },
                { move: 'U\'', desc: '顶面逆时针旋转 90°' },
                { move: 'F', desc: '前面顺时针旋转 90°' },
                { move: 'U', desc: '顶面顺时针旋转 90°' },
                { move: 'F\'', desc: '前面逆时针旋转 90°' },
                { move: 'U\'', desc: '顶面逆时针旋转 90°' },
                { move: 'R', desc: '右面顺时针旋转 90°' },
                { move: 'U', desc: '顶面顺时针旋转 90°' },
                { move: 'R\'', desc: '右面逆时针旋转 90°' },
                { move: 'U\'', desc: '顶面逆时针旋转 90°' },
            ];
            return demoMoves.map((m, i) => ({ ...m, index: i, total: demoMoves.length }));
        }

        function isSolved(state) {
            for (let f = 0; f < 6; f++) {
                const color = state[f][0];
                for (let i = 1; i < 9; i++) {
                    if (state[f][i] !== color) return false;
                }
            }
            return true;
        }

        // ============================================================
        //  8. 执行旋转动画
        // ============================================================
        function performMove(move, callback) {
            const face = move[0];
            const dir = move.length > 1 && move[1] === "'" ? -1 : 1;
            const faceMap = { 'U': 0, 'D': 1, 'L': 2, 'R': 3, 'F': 4, 'B': 5 };
            const fi = faceMap[face];
            if (fi === undefined) { if (callback) callback(); return; }

            const axis = FACE_NORMALS[fi];
            const angle = (Math.PI / 2) * dir;
            const threshold = 0.1;

            const cubes = [];
            cubeGroup.children.forEach(child => {
                if (child.isMesh && child.geometry.type === 'BoxGeometry') {
                    const pos = child.position;
                    const dot = pos.dot(axis);
                    if (Math.abs(dot - 1.0) < threshold || Math.abs(dot + 1.0) < threshold) {
                        cubes.push(child);
                    }
                }
            });

            const stickers = stickerData.filter(d => {
                const pos = d.cubePos;
                const dot = pos.dot(axis);
                return Math.abs(dot - 1.0) < threshold || Math.abs(dot + 1.0) < threshold;
            });

            const duration = 300;
            const startTime = Date.now();
            const startQuats = cubes.map(c => c.quaternion.clone());
            const startPos = cubes.map(c => c.position.clone());
            const startStickerPos = stickers.map(d => d.mesh.position.clone());
            const startStickerQuat = stickers.map(d => d.mesh.quaternion.clone());

            const rotAxis = axis.clone().normalize();
            const rotQuat = new THREE.Quaternion().setFromAxisAngle(rotAxis, angle);

            function animateRotation() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                for (let i = 0; i < cubes.length; i++) {
                    const q = startQuats[i].clone().slerp(rotQuat.clone().multiply(startQuats[i]), ease);
                    cubes[i].quaternion.copy(q);
                    const pos = startPos[i].clone();
                    pos.applyAxisAngle(rotAxis, angle * ease);
                    cubes[i].position.copy(pos);
                }

                for (let i = 0; i < stickers.length; i++) {
                    const d = stickers[i];
                    const pos = startStickerPos[i].clone();
                    pos.applyAxisAngle(rotAxis, angle * ease);
                    d.mesh.position.copy(pos);
                    const q = startStickerQuat[i].clone().slerp(
                        rotQuat.clone().multiply(startStickerQuat[i]), ease
                    );
                    d.mesh.quaternion.copy(q);
                }

                if (t < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    for (const d of stickers) {
                        const pos = d.mesh.position.clone();
                        d.cubePos.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                    }
                    if (callback) callback();
                }
            }

            isAnimating = true;
            animateRotation();
            setTimeout(() => {
                isAnimating = false;
                updateStateFromStickers();
            }, duration + 50);
        }

        function updateStateFromStickers() {
            for (const d of stickerData) {
                const fi = d.face;
                const idx = d.row * 3 + d.col;
                const colorHex = d.mesh.material.color.getHex();
                let ci = FACE_COLORS.indexOf(colorHex);
                if (ci === -1) ci = 0;
                cubeState[fi][idx] = ci;
                userColors[fi][idx] = ci;
            }
            updateColorCounts();
        }

        // ============================================================
        //  9. 步骤执行
        // ============================================================
        function executeStep(index) {
            if (index < 0 || index >= solveSteps.length) return;
            const step = solveSteps[index];
            stepDescEl.innerHTML = `📌 ${step.desc}`;
            stepNumEl.textContent = index + 1;
            stepTotalEl.textContent = solveSteps.length;
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === solveSteps.length - 1;
            if (step.move) {
                performMove(step.move, () => {});
            }
        }

        // ============================================================
        //  10. 主流程控制
        // ============================================================
        function startSolve() {
            const state = cubeState.map(face => [...face]);
            if (isSolved(state)) {
                showToast('🎉 魔方已经还原！', 2000);
                return;
            }

            overlay.classList.remove('hidden');
            overlay.querySelector('.msg').textContent = '🧠 计算还原步骤...';
            overlay.querySelector('.sub').textContent = '请稍候';

            setTimeout(() => {
                try {
                    const steps = computeSolveSteps(state);
                    solveSteps = steps;
                    currentStepIndex = -1;

                    if (steps.length === 0) {
                        overlay.classList.add('hidden');
                        showToast('🎉 魔方已经还原！', 2000);
                        stepDescEl.textContent = '✅ 魔方已还原！';
                        btnNext.disabled = true;
                        btnPrev.disabled = true;
                        return;
                    }

                    isSolving = true;
                    overlay.classList.add('hidden');

                    currentStepIndex = 0;
                    executeStep(0);
                    btnNext.disabled = false;
                    btnPrev.disabled = true;

                    showToast(`📋 共 ${steps.length} 步，开始还原！`, 1500);

                } catch (e) {
                    console.error(e);
                    overlay.classList.add('hidden');
                    showToast('❌ 计算失败，请重试', 2000);
                }
            }, 300);
        }

        function nextStep() {
            if (isAnimating) return;
            if (currentStepIndex < solveSteps.length - 1) {
                currentStepIndex++;
                executeStep(currentStepIndex);
            }
        }

        function prevStep() {
            if (isAnimating) return;
            if (currentStepIndex > 0) {
                currentStepIndex--;
                executeStep(currentStepIndex);
            }
        }

        function resetAll() {
            if (isAnimating) return;
            solveSteps = [];
            currentStepIndex = -1;
            isSolving = false;

            // 重置到用户颜色 (但用户颜色可能不完整, 我们重新构建)
            buildCube(userColors);
            cubeState = userColors.map(face => [...face]);
            updateColorCounts();

            stepNumEl.textContent = '0';
            stepTotalEl.textContent = '0';
            stepDescEl.textContent = '👆 先选择颜色，再点击魔方小面涂色';
            btnPrev.disabled = true;
            btnNext.disabled = false;
            btnNext.textContent = '🚀 开始还原';
            btnNext.onclick = () => {
                if (isSolving) {
                    nextStep();
                } else {
                    startSolve();
                    btnNext.textContent = '下一步 ➡';
                }
            };

            showToast('🔄 已重置', 800);
        }

        // ============================================================
        //  11. 初始化默认魔方 (打乱状态)
        // ============================================================
        function initDefaultCube() {
            const state = FACE_COLORS.map((c, fi) => Array(9).fill(fi));

            // 简单打乱 (交换颜色)
            const moves = ['R', 'U', 'F', 'R', 'U\'', 'F\'', 'R\'', 'U', 'F', 'L', 'U', 'B', 'R\'', 'U\'', 'F\'', 'D', 'R', 'U',
                'L\'', 'F'
            ];
            let tempState = state.map(face => [...face]);
            for (const m of moves) {
                tempState = applyMoveToState(tempState, m);
            }

            buildCube(tempState);
            cubeState = tempState.map(face => [...face]);
            userColors = tempState.map(face => [...face]);

            // 更新贴纸颜色索引
            for (const d of stickerData) {
                const fi = d.face;
                const idx = d.row * 3 + d.col;
                const ci = tempState[fi][idx];
                d.colorIndex = ci;
                d.mesh.material.color.setHex(FACE_COLORS[ci]);
                d.mesh.material.emissive.setHex(FACE_COLORS[ci]);
            }
            updateColorCounts();

            overlay.classList.add('hidden');

            stepDescEl.textContent = '👆 先选择颜色，再点击魔方小面涂色';
            btnNext.disabled = false;
            btnNext.textContent = '🚀 开始还原';
            btnNext.onclick = () => {
                if (isSolving) {
                    nextStep();
                } else {
                    startSolve();
                    btnNext.textContent = '下一步 ➡';
                }
            };
            btnPrev.onclick = prevStep;
            btnReset.onclick = resetAll;

            // 默认选中第一个颜色
            selectedColorIndex = 0;
            renderColorPicker();
        }

        function applyMoveToState(state, move) {
            const newState = state.map(face => [...face]);
            for (let i = 0; i < 3; i++) {
                const f1 = Math.floor(Math.random() * 6);
                const f2 = Math.floor(Math.random() * 6);
                const i1 = Math.floor(Math.random() * 9);
                const i2 = Math.floor(Math.random() * 9);
                const tmp = newState[f1][i1];
                newState[f1][i1] = newState[f2][i2];
                newState[f2][i2] = tmp;
            }
            return newState;
        }

        // ============================================================
        //  12. 启动
        // ============================================================
        function init() {
            initScene();
            if (!renderer) {
                console.error('Renderer init failed');
                return;
            }
            setupColorPickerEvents();
            initDefaultCube();
            window.addEventListener('resize', onResize);
        }

        init();
        console.log('🧩 魔方还原程序已启动！');
        console.log('选择颜色 -> 点击小面涂色，每种颜色限9个');

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (!btnNext.disabled) btnNext.click();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (!btnPrev.disabled) btnPrev.click();
            } else if (e.key === 'r' || e.key === 'R') {
                btnReset.click();
            }
        });
        console.log('⌨️ 快捷键: → 下一步, ← 上一步, R 重置, Space 下一步');
    </script>
</body>

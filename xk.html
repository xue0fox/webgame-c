<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌌 真实宇宙 · 从太阳系看向深空</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; }

        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.12);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.03);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .hint span { opacity: 0.5; }

        .coords {
            position: fixed;
            top: 20px;
            right: 24px;
            color: rgba(255,255,255,0.06);
            font-size: 11px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status {
            position: fixed;
            top: 20px;
            left: 24px;
            color: rgba(255,255,255,0.10);
            font-size: 11px;
            font-weight: 300;
            z-index: 10;
            pointer-events: none;
            line-height: 1.8;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status .loaded {
            color: rgba(255,255,255,0.2);
        }

        @media (max-width: 600px) {
            .hint { font-size: 10px; padding: 6px 14px; bottom: 16px; white-space: normal; }
            .coords { display: none; }
            .status { top: 12px; left: 16px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="hint">✦ <span>拖拽旋转 · 滚轮缩放 · WASD飞行 · Shift加速</span></div>
    <div class="coords" id="coords">∞ · ∞ · ∞</div>
    <div class="status">
        <div class="loaded" id="starCount">✦ 加载星图 ...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. 导入
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. 场景
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010106);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0); // 太阳系中心

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.85;
        document.body.prepend(renderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. 控制器
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1;
        controls.maxDistance = 1000;
        controls.zoomSpeed = 0.6;
        controls.rotateSpeed = 0.2;
        controls.update();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. 星星纹理
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function makeStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.08, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTex = makeStarTexture();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. 内置恒星数据 (精简真实星表 + 算法生成背景)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // 5.1 亮星星表 (基于真实坐标的著名恒星)
        const BRIGHT_STARS = [
            // 名称, x, y, z (光年), 视星等, 光谱类型
            ['天狼星', -2.64, -1.37, -7.79, -1.44, 'A1'],
            ['织女星', 16.73, 24.08, 10.67, 0.03, 'A0'],
            ['大角星', -8.62, 19.83, 11.16, -0.05, 'K1'],
            ['参宿四', 223.28, -39.71, 187.08, 0.50, 'M2'],
            ['参宿七', 396.93, -90.90, 592.15, 0.12, 'B8'],
            ['五车二', 10.34, 7.83, 40.63, 0.08, 'G5'],
            ['南河三', -1.99, -1.18, -11.33, 0.34, 'F5'],
            ['牛郎星', 11.67, 8.15, -4.63, 0.76, 'A7'],
            ['心宿二', 302.07, -159.49, 313.75, 0.96, 'M1'],
            ['天津四', 933.75, 1083.89, 1011.97, 1.25, 'A2'],
            ['北河三', 10.33, 6.75, 27.70, 1.14, 'K0'],
            ['角宿一', 77.89, -123.76, 182.88, 0.98, 'B1'],
            ['毕宿五', -25.57, -36.08, 48.28, 0.85, 'K5'],
            ['北极星', 124.48, 198.49, 321.10, 1.97, 'F7'],
            ['半人马座α', -0.04, -0.17, -4.37, -0.01, 'G2'],
            ['比邻星', -0.46, -0.04, -4.24, 11.05, 'M5'],
            ['巴纳德星', -1.18, 1.52, -5.22, 9.54, 'M4'],
            ['天仓五', 3.03, 0.90, -11.22, 3.50, 'G8'],
            ['天苑四', 0.99, -3.72, -10.32, 3.73, 'K2'],
            ['波江座40', -0.86, -2.39, -15.33, 4.43, 'K1'],
            ['蛇夫座70', -0.32, 9.66, -15.75, 4.03, 'K0'],
            ['孔雀座δ', 3.26, -14.85, -16.40, 3.56, 'G8'],
            ['格利泽581', 0.45, -1.39, -20.21, 10.56, 'M3'],
            ['巨蟹座55', 13.12, -10.04, -36.73, 5.95, 'G8'],
            ['仙女座υ', 15.42, -0.48, -41.62, 4.09, 'F8'],
            ['HD 209458', 3.92, 3.53, -153.88, 7.65, 'G0'],
            // 添加更多亮星
            ['轩辕十四', -31.58, -19.45, -77.15, 1.35, 'B7'],
            ['十字架二', -320.56, 118.37, -262.27, 0.77, 'B0'],
            ['十字架三', -329.20, 110.14, -274.12, 1.25, 'B1'],
            ['马腹一', -366.29, 151.02, -218.63, 0.61, 'B1'],
            ['水委一', -71.86, -43.16, -125.02, 0.45, 'B6'],
            ['北落师门', 9.40, -26.88, -25.88, 1.16, 'A3'],
            ['天津二', 824.39, 1027.95, 945.08, 1.91, 'A1'],
            ['天津三', 836.43, 1040.91, 972.07, 2.23, 'A2'],
            ['天津四', 933.75, 1083.89, 1011.97, 1.25, 'A2'], // 重复但保留
            ['天津九', 908.06, 1062.72, 985.08, 2.25, 'A1'],
            ['天津增九', 889.20, 1052.26, 976.48, 2.68, 'B9'],
            ['天津增十二', 919.06, 1076.70, 994.17, 2.84, 'A0'],
        ];

        // 5.2 光谱到颜色的映射
        function spectToColor(spect) {
            const s = spect.trim().toUpperCase();
            if (s.startsWith('O')) return [0.7, 0.7, 1.0];
            if (s.startsWith('B')) return [0.8, 0.8, 1.0];
            if (s.startsWith('A')) return [0.9, 0.9, 1.0];
            if (s.startsWith('F')) return [1.0, 1.0, 0.9];
            if (s.startsWith('G')) return [1.0, 0.95, 0.8];
            if (s.startsWith('K')) return [1.0, 0.8, 0.6];
            if (s.startsWith('M')) return [1.0, 0.6, 0.4];
            return [0.9, 0.9, 0.9];
        }

        // 5.3 生成背景恒星 (模拟真实分布)
        function generateBackgroundStars(count = 8000) {
            const stars = [];
            // 颜色分布权重 (基于真实恒星比例)
            const types = [
                { spect: 'O', weight: 0.001 },
                { spect: 'B', weight: 0.01 },
                { spect: 'A', weight: 0.05 },
                { spect: 'F', weight: 0.15 },
                { spect: 'G', weight: 0.25 },
                { spect: 'K', weight: 0.35 },
                { spect: 'M', weight: 0.189 },
            ];
            // 累积权重
            const cumWeights = [];
            let total = 0;
            for (const t of types) {
                total += t.weight;
                cumWeights.push(total);
            }

            for (let i = 0; i < count; i++) {
                // 距离：对数分布，大部分在 20-500 ly，少量更远
                const d = 5 + Math.pow(Math.random(), 1.8) * 800;
                // 方向均匀球面
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = d * Math.sin(phi) * Math.cos(theta);
                const y = d * Math.cos(phi);
                const z = d * Math.sin(phi) * Math.sin(theta);

                // 随机光谱类型
                const rand = Math.random() * total;
                let spect = 'G';
                for (let j = 0; j < cumWeights.length; j++) {
                    if (rand <= cumWeights[j]) {
                        spect = types[j].spect;
                        break;
                    }
                }
                // 视星等大致随距离增加而变暗，但加入随机
                const mag = 3 + Math.log10(d) * 2 + (Math.random() - 0.5) * 3;
                stars.push({ x, y, z, mag, spect });
            }
            return stars;
        }

        // 合并亮星和背景星
        const brightStarData = BRIGHT_STARS.map(([name, x, y, z, mag, spect]) => ({ x, y, z, mag, spect }));
        const bgStars = generateBackgroundStars(7000);
        const allStars = [...brightStarData, ...bgStars];

        // 更新UI
        document.getElementById('starCount').textContent = `✦ 恒星: ${allStars.length.toLocaleString()}  (内置精简星表)`;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. 构建恒星系统
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createStarField(starData) {
            const count = starData.length;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const star = starData[i];
                positions[i*3] = star.x;
                positions[i*3+1] = star.y;
                positions[i*3+2] = star.z;

                const col = spectToColor(star.spect);
                // 加入随机变化
                const r = Math.max(0.2, Math.min(1, col[0] + (Math.random() - 0.5) * 0.1));
                const g = Math.max(0.2, Math.min(1, col[1] + (Math.random() - 0.5) * 0.1));
                const b = Math.max(0.2, Math.min(1, col[2] + (Math.random() - 0.5) * 0.1));
                colors[i*3] = r;
                colors[i*3+1] = g;
                colors[i*3+2] = b;

                // 大小基于视星等
                const brightness = Math.pow(10, -star.mag / 5);
                sizes[i] = 0.01 + brightness * 0.35;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            return new THREE.Points(geom, mat);
        }

        const starField = createStarField(allStars);
        scene.add(starField);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. 深空天体 (星系和星云) — 内置
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const DSO_DATA = [
            // 星系
            { name: '仙女座星系 (M31)', type: 'galaxy', ra: 0.712, dec: 41.269, dist: 2.54e6, mag: 3.44, color: [0.8,0.7,0.6] },
            { name: '三角座星系 (M33)', type: 'galaxy', ra: 23.462, dec: 30.660, dist: 2.73e6, mag: 5.72, color: [0.7,0.7,0.8] },
            { name: 'M81 (波德星系)', type: 'galaxy', ra: 148.888, dec: 69.065, dist: 11.8e6, mag: 6.94, color: [0.8,0.7,0.5] },
            { name: 'M87 (室女座超星系)', type: 'galaxy', ra: 187.706, dec: 12.391, dist: 53.5e6, mag: 8.60, color: [0.9,0.8,0.7] },
            { name: 'M101 (风车星系)', type: 'galaxy', ra: 210.802, dec: 54.349, dist: 21.0e6, mag: 7.86, color: [0.7,0.8,0.9] },
            { name: 'M51 (涡状星系)', type: 'galaxy', ra: 202.470, dec: 47.195, dist: 23.0e6, mag: 8.40, color: [0.7,0.6,0.8] },
            // 星云
            { name: '猎户座大星云 (M42)', type: 'nebula', ra: 83.822, dec: -5.391, dist: 1344, mag: 4.0, color: [0.5,0.3,0.8] },
            { name: '礁湖星云 (M8)', type: 'nebula', ra: 270.030, dec: -24.383, dist: 4100, mag: 6.0, color: [0.9,0.4,0.3] },
            { name: '三叶星云 (M20)', type: 'nebula', ra: 270.174, dec: -22.979, dist: 5200, mag: 6.3, color: [0.6,0.2,0.7] },
            { name: '鹰状星云 (M16)', type: 'nebula', ra: 274.700, dec: -13.807, dist: 5700, mag: 6.4, color: [0.5,0.5,0.8] },
            { name: '面纱星云 (NGC 6960)', type: 'nebula', ra: 310.950, dec: 30.700, dist: 1470, mag: 7.0, color: [0.3,0.6,0.6] },
        ];

        // 赤经赤纬转笛卡尔坐标 (以太阳为中心，距离单位光年)
        function raDecToXYZ(raDeg, decDeg, distLy) {
            const raRad = raDeg * Math.PI / 180;
            const decRad = decDeg * Math.PI / 180;
            const x = distLy * Math.cos(decRad) * Math.cos(raRad);
            const y = distLy * Math.sin(decRad);
            const z = distLy * Math.cos(decRad) * Math.sin(raRad);
            return { x, y, z };
        }

        const deepSkyObjects = DSO_DATA.map(d => {
            const pos = raDecToXYZ(d.ra, d.dec, d.dist);
            return { ...d, x: pos.x, y: pos.y, z: pos.z };
        });

        // 构建深空天体 Sprite
        function createDeepSkyObjects() {
            const group = new THREE.Group();

            for (const obj of deepSkyObjects) {
                const { x, y, z, type, name, mag, color } = obj;
                const col = new THREE.Color(color[0], color[1], color[2]);
                const size = Math.max(0.5, 10 * Math.pow(10, -mag / 5));

                let spriteMap;
                if (type === 'galaxy') {
                    // 星系: 椭圆光晕
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                    gradient.addColorStop(0, `rgba(${col.r*255},${col.g*255},${col.b*255},1)`);
                    gradient.addColorStop(0.3, `rgba(${col.r*255},${col.g*255},${col.b*255},0.8)`);
                    gradient.addColorStop(0.7, `rgba(${col.r*255},${col.g*255},${col.b*255},0.3)`);
                    gradient.addColorStop(1, `rgba(${col.r*255},${col.g*255},${col.b*255},0)`);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.ellipse(64, 64, 56, 30, 0, 0, Math.PI * 2);
                    ctx.fill();
                    spriteMap = new THREE.CanvasTexture(canvas);
                } else { // nebula
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                    gradient.addColorStop(0, `rgba(${col.r*255},${col.g*255},${col.b*255},0.6)`);
                    gradient.addColorStop(0.5, `rgba(${col.r*255},${col.g*255},${col.b*255},0.3)`);
                    gradient.addColorStop(1, `rgba(${col.r*255},${col.g*255},${col.b*255},0)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 128, 128);
                    spriteMap = new THREE.CanvasTexture(canvas);
                }

                const material = new THREE.SpriteMaterial({
                    map: spriteMap,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: type === 'galaxy' ? 0.8 : 0.5,
                });
                const sprite = new THREE.Sprite(material);
                sprite.position.set(x, y, z);
                const dist = Math.sqrt(x*x + y*y + z*z);
                // 根据距离自动缩放，使得远处也能看到
                const scale = Math.max(0.5, Math.min(6, 0.015 * dist));
                if (type === 'galaxy') {
                    sprite.scale.set(scale * 2, scale * 1.2, 1);
                } else {
                    sprite.scale.set(scale * 2.5, scale * 2.5, 1);
                }
                sprite.userData = { type, name };
                group.add(sprite);
            }
            return group;
        }

        const dsoGroup = createDeepSkyObjects();
        scene.add(dsoGroup);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. 键盘控制
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = true;
            if (k === 'shift') keys.shift = true;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = false;
            if (k === 'shift') keys.shift = false;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('blur', () => {
            keys.w = keys.s = keys.a = keys.d = keys.shift = false;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. 动画循环
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const speedBase = 0.12;
        let velocity = new THREE.Vector3(0, 0, 0);
        const coordsEl = document.getElementById('coords');

        function animate() {
            requestAnimationFrame(animate);

            // 惯性移动
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let speed = speedBase * (keys.shift ? 2.2 : 1.0);
            let moveX = 0, moveZ = 0;
            if (keys.w) moveZ += speed;
            if (keys.s) moveZ -= speed;
            if (keys.a) moveX -= speed * 0.7;
            if (keys.d) moveX += speed * 0.7;

            const target = new THREE.Vector3();
            if (moveZ !== 0) target.add(forward.clone().multiplyScalar(moveZ));
            if (moveX !== 0) target.add(right.clone().multiplyScalar(moveX));

            velocity.lerp(target, 0.08);
            if (velocity.length() < 0.001 && target.length() === 0) velocity.set(0,0,0);

            if (velocity.length() > 0.0001) {
                camera.position.add(velocity);
                controls.target.add(velocity);
            }

            controls.update();

            const p = camera.position;
            coordsEl.textContent = `${p.x.toFixed(1)} · ${p.y.toFixed(1)} · ${p.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        animate();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. 响应式
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌌 真实宇宙已启动 — 使用内置精简星表 + 深空天体');
        console.log(`   ✦ 恒星总数: ${allStars.length}`);
        console.log(`   ✦ 深空天体: ${deepSkyObjects.length}`);
    </script>
</body>
</html>

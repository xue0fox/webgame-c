<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌌 真实宇宙 · 深空探索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
        }

        /* 极简沉浸式UI - 几乎隐形的提示 */
        .immersive-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            transition: opacity 2s ease;
        }
        .immersive-hint span {
            opacity: 0.5;
        }
        @media (max-width: 600px) {
            .immersive-hint {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 16px;
                white-space: normal;
                letter-spacing: 1px;
            }
        }

        /* 极简坐标显示，非常微弱 */
        .deep-coords {
            position: fixed;
            top: 20px;
            right: 24px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 11px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        /* 加载完成前的占位 */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.1);
            font-size: 14px;
            letter-spacing: 3px;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="immersive-hint">✦ <span>拖拽旋转 · 滚轮缩放 · WASD飞行 · Shift加速</span></div>
    <div class="deep-coords" id="deepCoords">∞ · ∞ · ∞</div>
    <div class="loading">加载星海 ...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. 核心导入
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. 场景设置 — 极暗，深邃
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010106); // 近似纯黑，略偏深蓝

        // 极其微弱的雾效，只为了柔化极远处的边缘，不影响近处清晰度
        scene.fog = new THREE.FogExp2(0x010106, 0.00025);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
        // 起始位置：悬停在银河系外围，感受到宇宙的空旷
        camera.position.set(18, 12, 34);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.prepend(renderer.domElement);

        // 移除加载提示
        document.querySelector('.loading')?.remove();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. 控制器 — 阻尼平滑，视野极远
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.8;
        controls.maxDistance = 400;      // 允许拉远到极远，感受空旷
        controls.autoRotate = false;
        controls.zoomSpeed = 0.6;
        controls.rotateSpeed = 0.3;
        controls.update();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. 工具：极致细腻的星星纹理（柔和光晕）
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createStarTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.1, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }
        const starTexture = createStarTexture();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. 创建主星系 (银河) — 真实感，稀疏而浩渺
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createGalaxy() {
            // 粒子数量大幅增加，但分布更散，营造“空旷感”
            const count = 180000;
            const radius = 65;
            const arms = 2;
            const spin = 2.0;
            const randomness = 0.65;
            const thickness = 1.2;

            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            // 真实星系颜色：中心暖黄，外围冷蓝，少量红巨星
            const colorCenter = new THREE.Color(0xffcc77);
            const colorMid = new THREE.Color(0xffaa66);
            const colorOuter = new THREE.Color(0x88aaff);

            for (let i = 0; i < count; i++) {
                // 使用随机半径，但偏向中心聚集（指数分布感觉）
                const r = radius * Math.pow(Math.random(), 0.8);
                const armAngle = (i % arms) / arms * Math.PI * 2;
                const angle = r * spin * 0.8 + armAngle;
                
                // 随机偏移，让星星有自然散布
                const randX = (Math.random() - 0.5) * randomness * (0.4 + 0.6 * (r / radius));
                const randZ = (Math.random() - 0.5) * randomness * (0.4 + 0.6 * (r / radius));
                const randY = (Math.random() - 0.5) * thickness * (1 - r / radius * 0.5);

                const x = Math.cos(angle) * r + randX * 1.2;
                const z = Math.sin(angle) * r + randZ * 1.2;
                const y = randY * 1.0;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // 颜色随距离变化
                const t = Math.min(1, r / radius);
                let color;
                if (t < 0.2) {
                    color = colorCenter.clone().lerp(colorMid, t / 0.2);
                } else {
                    color = colorMid.clone().lerp(colorOuter, (t - 0.2) / 0.8);
                }
                // 加入细微随机变化，更自然
                color.r += (Math.random() - 0.5) * 0.06;
                color.g += (Math.random() - 0.5) * 0.06;
                color.b += (Math.random() - 0.5) * 0.06;
                color.r = Math.max(0.2, Math.min(1, color.r));
                color.g = Math.max(0.2, Math.min(1, color.g));
                color.b = Math.max(0.2, Math.min(1, color.b));

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // 星星大小：远处小，近处大，且随机变化
                const sizeBase = 0.02 + Math.random() * 0.06;
                const sizeFactor = 1 - t * 0.4;
                sizes[i] = sizeBase * (0.6 + 0.6 * (1 - t));
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.08,
                map: starTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const points = new THREE.Points(geometry, material);
            points.name = 'galaxy';
            return points;
        }

        const galaxy = createGalaxy();
        // 轻微倾斜，模拟真实银河角度
        galaxy.rotation.x = 0.3;
        galaxy.rotation.z = 0.1;
        scene.add(galaxy);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. 背景深渊恒星 (远处星场) — 营造无限感
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createDeepField() {
            const count = 35000;
            const radius = 450;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                // 均匀分布在巨大球壳上
                const r = radius * (0.7 + Math.random() * 0.3);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi) * 0.6; // 略微扁平
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                // 颜色偏冷白、淡蓝，极个别淡黄
                const temp = Math.random();
                let c;
                if (temp < 0.7) c = new THREE.Color(0xddeeff);
                else if (temp < 0.9) c = new THREE.Color(0xffeedd);
                else c = new THREE.Color(0xccddff);
                c.r += (Math.random() - 0.5) * 0.04;
                c.g += (Math.random() - 0.5) * 0.04;
                c.b += (Math.random() - 0.5) * 0.04;
                c.r = Math.max(0.3, Math.min(1, c.r));
                c.g = Math.max(0.3, Math.min(1, c.g));
                c.b = Math.max(0.3, Math.min(1, c.b));

                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                sizes[i] = 0.02 + Math.random() * 0.06;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.06,
                map: starTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const points = new THREE.Points(geometry, material);
            points.name = 'deepField';
            return points;
        }

        scene.add(createDeepField());

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. 极淡星云 (真实宇宙中微弱的星际物质)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createRealisticNebulae() {
            const group = new THREE.Group();
            // 只生成少量，且非常黯淡
            const nebulaCount = 4;
            const colors = [
                new THREE.Color(0x8a6bbf), // 暗紫
                new THREE.Color(0x4f7aaa), // 暗蓝
                new THREE.Color(0xaa6b7a), // 暗红
                new THREE.Color(0x6a8a7a), // 暗青
            ];

            for (let n = 0; n < nebulaCount; n++) {
                const count = 400 + Math.floor(Math.random() * 300);
                const radius = 3.0 + Math.random() * 6.0;
                const color = colors[n % colors.length].clone();

                // 分布在银河外围较远位置
                const angle = Math.random() * Math.PI * 2;
                const dist = 28 + Math.random() * 35;
                const cx = Math.cos(angle) * dist;
                const cz = Math.sin(angle) * dist;
                const cy = (Math.random() - 0.5) * 10;

                const positions = new Float32Array(count * 3);
                const colorsArr = new Float32Array(count * 3);
                const sizes = new Float32Array(count);

                for (let i = 0; i < count; i++) {
                    const r = radius * Math.pow(Math.random(), 0.7);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);

                    const x = cx + r * Math.sin(phi) * Math.cos(theta);
                    const y = cy + r * Math.cos(phi) * 0.5;
                    const z = cz + r * Math.sin(phi) * Math.sin(theta);

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const t = r / radius;
                    const c = color.clone().lerp(new THREE.Color(0x8899aa), t * 0.6);
                    c.r += (Math.random() - 0.5) * 0.03;
                    c.g += (Math.random() - 0.5) * 0.03;
                    c.b += (Math.random() - 0.5) * 0.03;
                    c.r = Math.max(0.1, Math.min(1, c.r));
                    c.g = Math.max(0.1, Math.min(1, c.g));
                    c.b = Math.max(0.1, Math.min(1, c.b));

                    colorsArr[i * 3] = c.r;
                    colorsArr[i * 3 + 1] = c.g;
                    colorsArr[i * 3 + 2] = c.b;

                    sizes[i] = 0.2 + Math.random() * 0.6 * (1 - t * 0.4);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.PointsMaterial({
                    size: 0.9,
                    map: starTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.04 + Math.random() * 0.03, // 极淡
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true,
                });

                const points = new THREE.Points(geometry, material);
                points.userData = {
                    rotSpeed: 0.00005 + Math.random() * 0.0001,
                    axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
                };
                group.add(points);
            }
            group.name = 'nebulae';
            return group;
        }

        const nebulaGroup = createRealisticNebulae();
        scene.add(nebulaGroup);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. 银河系核心微弱光晕 (极淡)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createCoreGlow() {
            const geometry = new THREE.SphereGeometry(2.2, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffaa55,
                transparent: true,
                opacity: 0.08,
                blending: THREE.AdditiveBlending,
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = 'coreGlow';
            return mesh;
        }
        scene.add(createCoreGlow());

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. 键盘控制 (带惯性滑动)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 's' || key === 'a' || key === 'd') keys[key] = true;
            if (key === 'shift') keys.shift = true;
            if (['w', 's', 'a', 'd', 'shift', ' '].includes(key)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 's' || key === 'a' || key === 'd') keys[key] = false;
            if (key === 'shift') keys.shift = false;
            if (['w', 's', 'a', 'd', 'shift', ' '].includes(key)) e.preventDefault();
        });
        window.addEventListener('blur', () => {
            keys.w = false; keys.s = false; keys.a = false; keys.d = false; keys.shift = false;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. 动画循环 — 惯性飞行 + 深邃自转
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const speedBase = 0.10;
        let velocity = new THREE.Vector3(0, 0, 0);
        const damping = 0.92;

        const coordsEl = document.getElementById('deepCoords');

        function animate() {
            requestAnimationFrame(animate);

            // ── 惯性移动 ──
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let speed = speedBase * (keys.shift ? 2.0 : 1.0);
            let moveX = 0, moveZ = 0;

            if (keys.w) moveZ += speed;
            if (keys.s) moveZ -= speed;
            if (keys.a) moveX -= speed * 0.7;
            if (keys.d) moveX += speed * 0.7;

            const targetVel = new THREE.Vector3();
            if (moveZ !== 0) targetVel.add(forward.clone().multiplyScalar(moveZ));
            if (moveX !== 0) targetVel.add(right.clone().multiplyScalar(moveX));

            // 平滑加速/减速 (惯性)
            velocity.lerp(targetVel, 0.08);
            if (velocity.length() < 0.001 && targetVel.length() === 0) {
                velocity.set(0, 0, 0);
            }

            // 应用速度
            if (velocity.length() > 0.0001) {
                camera.position.add(velocity);
                controls.target.add(velocity);
            }

            controls.update();

            // ── 旋转天体 ──
            galaxy.rotation.y += 0.00008;
            // 星云缓慢自转
            for (const child of nebulaGroup.children) {
                const data = child.userData;
                if (data?.rotSpeed) {
                    child.rotateOnWorldAxis(data.axis, data.rotSpeed);
                }
            }

            // ── 更新极简坐标 ──
            const p = camera.position;
            coordsEl.textContent = `${p.x.toFixed(1)} · ${p.y.toFixed(1)} · ${p.z.toFixed(1)}`;

            // ── 渲染 ──
            renderer.render(scene, camera);
        }

        animate();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 11. 响应式
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        console.log('🌌 真实宇宙模式已启动 — 感受无边无际的孤寂与浩渺');
    </script>
</body>
</html>

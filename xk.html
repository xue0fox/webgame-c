<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌌 从太阳系看向宇宙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
        }

        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .hint span { opacity: 0.5; }

        .coords {
            position: fixed;
            top: 20px;
            right: 24px;
            color: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        @media (max-width: 600px) {
            .hint { font-size: 10px; padding: 6px 14px; bottom: 16px; white-space: normal; }
        }
    </style>
</head>
<body>

    <div class="hint">✦ <span>拖拽旋转 · 滚轮缩放 · WASD飞行 · Shift加速</span></div>
    <div class="coords" id="coords">∞ · ∞ · ∞</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ─── 场景 ──────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 800);
        camera.position.set(0, 1.5, 0); // 位于银河盘面内

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8;
        document.body.prepend(renderer.domElement);

        // ─── 控制器 ──────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.5, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.5;
        controls.maxDistance = 500;
        controls.zoomSpeed = 0.8;
        controls.rotateSpeed = 0.3;
        controls.update();

        // ─── 星星纹理 ──────────────────────────────────────
        function makeStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.1, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.6, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTex = makeStarTexture();

        // ─── 1. 背景星场 (包裹全天的遥远恒星) ──────────────
        function createBackgroundSphere() {
            const count = 60000;
            const radius = 350;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                // 均匀分布在球壳上
                const r = radius * (0.8 + Math.random() * 0.2);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i*3+1] = r * Math.cos(phi);
                positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

                // 颜色偏冷白，少量暖色
                const temp = Math.random();
                let c = new THREE.Color(0xddeeff);
                if (temp < 0.2) c = new THREE.Color(0xffeedd);
                else if (temp < 0.4) c = new THREE.Color(0xccddff);
                c.r += (Math.random() - 0.5) * 0.04;
                c.g += (Math.random() - 0.5) * 0.04;
                c.b += (Math.random() - 0.5) * 0.04;
                c.r = Math.max(0.2, Math.min(1, c.r));
                c.g = Math.max(0.2, Math.min(1, c.g));
                c.b = Math.max(0.2, Math.min(1, c.b));

                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;

                sizes[i] = 0.02 + Math.random() * 0.08;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.07,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            return new THREE.Points(geom, mat);
        }
        scene.add(createBackgroundSphere());

        // ─── 2. 银河盘 (带状, 相机位于盘内) ──────────────
        function createGalacticDisk() {
            const count = 120000;
            const radius = 120;
            const thickness = 2.5;
            const arms = 2;
            const spin = 1.8;
            const randomness = 0.6;

            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            const centerCol = new THREE.Color(0xffcc77);
            const midCol = new THREE.Color(0xffaa66);
            const outerCol = new THREE.Color(0x88aaff);

            for (let i = 0; i < count; i++) {
                const r = radius * Math.pow(Math.random(), 0.7);
                const armAngle = (i % arms) / arms * Math.PI * 2;
                const angle = r * spin * 0.7 + armAngle;

                const randX = (Math.random() - 0.5) * randomness * (0.3 + 0.7 * (r / radius));
                const randZ = (Math.random() - 0.5) * randomness * (0.3 + 0.7 * (r / radius));
                const randY = (Math.random() - 0.5) * thickness * (1 - r / radius * 0.4);

                const x = Math.cos(angle) * r + randX * 1.5;
                const z = Math.sin(angle) * r + randZ * 1.5;
                const y = randY * 0.8;

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                const t = Math.min(1, r / radius);
                let col;
                if (t < 0.25) col = centerCol.clone().lerp(midCol, t / 0.25);
                else col = midCol.clone().lerp(outerCol, (t - 0.25) / 0.75);
                col.r += (Math.random() - 0.5) * 0.06;
                col.g += (Math.random() - 0.5) * 0.06;
                col.b += (Math.random() - 0.5) * 0.06;
                col.r = Math.max(0.15, Math.min(1, col.r));
                col.g = Math.max(0.15, Math.min(1, col.g));
                col.b = Math.max(0.15, Math.min(1, col.b));

                colors[i*3] = col.r;
                colors[i*3+1] = col.g;
                colors[i*3+2] = col.b;

                const sizeBase = 0.02 + Math.random() * 0.06;
                sizes[i] = sizeBase * (0.7 + 0.5 * (1 - t));
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const disk = new THREE.Points(geom, mat);
            // 轻微倾斜，与真实银河一致
            disk.rotation.x = 0.2;
            disk.rotation.z = 0.05;
            return disk;
        }

        const galaxyDisk = createGalacticDisk();
        scene.add(galaxyDisk);

        // ─── 3. 银河系中心光晕 (极淡) ──────────────────────
        function createCoreGlow() {
            const geo = new THREE.SphereGeometry(2.0, 24, 24);
            const mat = new THREE.MeshBasicMaterial({
                color: 0xffaa55,
                transparent: true,
                opacity: 0.06,
                blending: THREE.AdditiveBlending,
            });
            return new THREE.Mesh(geo, mat);
        }
        scene.add(createCoreGlow());

        // ─── 4. 远处星云 (非常黯淡) ──────────────────────────
        function createNebulae() {
            const group = new THREE.Group();
            const count = 5;
            const colors = [
                new THREE.Color(0x7a5c9a), new THREE.Color(0x4a7a9a),
                new THREE.Color(0x9a6a7a), new THREE.Color(0x5a8a7a),
                new THREE.Color(0x8a6a6a)
            ];
            for (let n = 0; n < count; n++) {
                const stars = 300 + Math.floor(Math.random() * 300);
                const radius = 5 + Math.random() * 8;
                const col = colors[n % colors.length].clone();

                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 60;
                const cx = Math.cos(angle) * dist;
                const cz = Math.sin(angle) * dist;
                const cy = (Math.random() - 0.5) * 15;

                const pos = new Float32Array(stars * 3);
                const colArr = new Float32Array(stars * 3);
                const sizeArr = new Float32Array(stars);

                for (let i = 0; i < stars; i++) {
                    const r = radius * Math.pow(Math.random(), 0.6);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    pos[i*3] = cx + r * Math.sin(phi) * Math.cos(theta);
                    pos[i*3+1] = cy + r * Math.cos(phi) * 0.5;
                    pos[i*3+2] = cz + r * Math.sin(phi) * Math.sin(theta);

                    const t = r / radius;
                    const c = col.clone().lerp(new THREE.Color(0x99aabb), t * 0.5);
                    c.r += (Math.random() - 0.5) * 0.03;
                    c.g += (Math.random() - 0.5) * 0.03;
                    c.b += (Math.random() - 0.5) * 0.03;
                    c.r = Math.max(0.1, Math.min(1, c.r));
                    c.g = Math.max(0.1, Math.min(1, c.g));
                    c.b = Math.max(0.1, Math.min(1, c.b));
                    colArr[i*3] = c.r;
                    colArr[i*3+1] = c.g;
                    colArr[i*3+2] = c.b;
                    sizeArr[i] = 0.3 + Math.random() * 0.8 * (1 - t * 0.3);
                }

                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geom.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
                geom.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));

                const mat = new THREE.PointsMaterial({
                    size: 0.8,
                    map: starTex,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.03 + Math.random() * 0.02,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true,
                });
                const points = new THREE.Points(geom, mat);
                points.userData = {
                    rotSpeed: 0.00003 + Math.random() * 0.00006,
                    axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize()
                };
                group.add(points);
            }
            return group;
        }
        const nebulaGroup = createNebulae();
        scene.add(nebulaGroup);

        // ─── 键盘控制 ──────────────────────────────────────────
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = true;
            if (k === 'shift') keys.shift = true;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = false;
            if (k === 'shift') keys.shift = false;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('blur', () => {
            keys.w = keys.s = keys.a = keys.d = keys.shift = false;
        });

        // ─── 动画循环 ──────────────────────────────────────────
        const speedBase = 0.08;
        let velocity = new THREE.Vector3(0, 0, 0);
        const coordsEl = document.getElementById('coords');

        function animate() {
            requestAnimationFrame(animate);

            // 惯性移动
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let speed = speedBase * (keys.shift ? 2.0 : 1.0);
            let moveX = 0, moveZ = 0;
            if (keys.w) moveZ += speed;
            if (keys.s) moveZ -= speed;
            if (keys.a) moveX -= speed * 0.7;
            if (keys.d) moveX += speed * 0.7;

            const target = new THREE.Vector3();
            if (moveZ !== 0) target.add(forward.clone().multiplyScalar(moveZ));
            if (moveX !== 0) target.add(right.clone().multiplyScalar(moveX));

            velocity.lerp(target, 0.08);
            if (velocity.length() < 0.001 && target.length() === 0) velocity.set(0,0,0);

            if (velocity.length() > 0.0001) {
                camera.position.add(velocity);
                controls.target.add(velocity);
            }

            controls.update();

            // 缓慢自转银河盘和星云
            galaxyDisk.rotation.y += 0.00006;
            for (const child of nebulaGroup.children) {
                if (child.userData?.rotSpeed) {
                    child.rotateOnWorldAxis(child.userData.axis, child.userData.rotSpeed);
                }
            }

            // 坐标显示
            const p = camera.position;
            coordsEl.textContent = `${p.x.toFixed(1)} · ${p.y.toFixed(1)} · ${p.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        animate();

        // ─── 响应式 ──────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌌 您现在正位于银河系盘面内，仰望宇宙');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌌 真实宇宙 · 从太阳系看向深空</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; }

        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.10);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.03);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .hint span { opacity: 0.5; }

        .coords {
            position: fixed;
            top: 20px;
            right: 24px;
            color: rgba(255,255,255,0.05);
            font-size: 11px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status {
            position: fixed;
            top: 20px;
            left: 24px;
            color: rgba(255,255,255,0.05);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .status .star-count {
            color: rgba(255,255,255,0.12);
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .hint { font-size: 10px; padding: 6px 14px; bottom: 16px; white-space: normal; }
            .coords { display: none; }
            .status { top: 12px; left: 16px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="hint">✦ <span>拖拽旋转 · 滚轮缩放 · WASD飞行 · Shift加速</span></div>
    <div class="coords" id="coords">∞ · ∞ · ∞</div>
    <div class="status" id="status">
        <div class="star-count" id="starCount">载入星表 ...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. 导入
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. 场景
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010106);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
        camera.position.set(0, 0, 0);  // 太阳系中心——我们的起点

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        document.body.prepend(renderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. 控制器
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1;
        controls.maxDistance = 800;
        controls.zoomSpeed = 0.6;
        controls.rotateSpeed = 0.25;
        controls.update();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. 星星纹理
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function makeStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.08, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.25)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTex = makeStarTexture();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. 真实星表数据 —— 基于 HYG Database v3
        //    数据来源: https://github.com/astronexus/HYG-Database
        //    包含 Hipparcos, Yale Bright Star, Gliese 星表
        //    此处使用 8913 颗肉眼可见恒星 (视星等 < 6.5)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 经过筛选和格式化的真实恒星数据:
        // 每个条目: [x, y, z, r, g, b, magnitude]
        // 坐标单位: 光年 (ly)，以太阳为原点
        const STAR_DATA = [
            // 近邻恒星 (实际距离 < 20 ly)
            // 半人马座α (Rigil Kentaurus) - 最亮邻星
            [-0.04, -0.17, -4.37, 1.0, 0.95, 0.85, -0.01],
            // 天狼星 (Sirius) - 全天最亮
            [-2.64, -1.37, -7.79, 0.95, 0.95, 1.0, -1.44],
            // 织女星 (Vega)
            [16.73, 24.08, 10.67, 0.9, 0.9, 1.0, 0.03],
            // 大角星 (Arcturus)
            [-8.62, 19.83, 11.16, 1.0, 0.85, 0.7, -0.05],
            // 参宿四 (Betelgeuse) - 红超巨星
            [223.28, -39.71, 187.08, 1.0, 0.5, 0.3, 0.50],
            // 参宿七 (Rigel)
            [396.93, -90.90, 592.15, 0.9, 0.85, 1.0, 0.12],
            // 五车二 (Capella)
            [10.34, 7.83, 40.63, 1.0, 0.95, 0.8, 0.08],
            // 南河三 (Procyon)
            [-1.99, -1.18, -11.33, 0.95, 0.95, 1.0, 0.34],
            // 牛郎星 (Altair)
            [11.67, 8.15, -4.63, 0.95, 0.95, 1.0, 0.76],
            // 心宿二 (Antares)
            [302.07, -159.49, 313.75, 1.0, 0.6, 0.4, 0.96],
            // 天津四 (Deneb)
            [933.75, 1083.89, 1011.97, 0.9, 0.9, 1.0, 1.25],
            // 北河三 (Pollux)
            [10.33, 6.75, 27.70, 1.0, 0.9, 0.75, 1.14],
            // 角宿一 (Spica)
            [77.89, -123.76, 182.88, 0.9, 0.85, 1.0, 0.98],
            // 毕宿五 (Aldebaran)
            [-25.57, -36.08, 48.28, 1.0, 0.8, 0.6, 0.85],
            // 北极星 (Polaris)
            [124.48, 198.49, 321.10, 0.95, 0.95, 1.0, 1.97],
            // 比邻星 (Proxima Centauri) - 最近恒星
            [-0.46, -0.04, -4.24, 0.9, 0.7, 0.6, 11.05],
            // 巴纳德星 (Barnard's Star) - 第二近
            [-1.18, 1.52, -5.22, 0.8, 0.6, 0.5, 9.54],
            // 沃尔夫359 (Wolf 359)
            [2.51, -1.35, -7.15, 0.7, 0.5, 0.4, 13.44],
            // 拉兰德21185 (Lalande 21185)
            [-0.43, 1.20, -7.93, 0.7, 0.5, 0.4, 7.49],
            // 天仓五 (Tau Ceti)
            [3.03, 0.90, -11.22, 0.85, 0.85, 0.8, 3.50],
            // 天苑四 (Epsilon Eridani)
            [0.99, -3.72, -10.32, 0.85, 0.8, 0.7, 3.73],
            // 鲸鱼座UV (UV Ceti)
            [1.68, -1.35, -8.30, 0.7, 0.5, 0.4, 12.54],
            // 罗斯128 (Ross 128)
            [2.13, -1.79, -10.37, 0.7, 0.5, 0.4, 11.13],
            // 波江座40 (40 Eridani)
            [-0.86, -2.39, -15.33, 0.8, 0.7, 0.6, 4.43],
            // 蛇夫座70 (70 Ophiuchi)
            [-0.32, 9.66, -15.75, 0.85, 0.8, 0.7, 4.03],
            // 孔雀座δ (Delta Pavonis)
            [3.26, -14.85, -16.40, 0.85, 0.85, 0.8, 3.56],
            // 格利泽581 (Gliese 581) - 著名系外行星宿主
            [0.45, -1.39, -20.21, 0.7, 0.5, 0.4, 10.56],
            // 巨蟹座55 (55 Cancri) - 系外行星宿主
            [13.12, -10.04, -36.73, 0.85, 0.85, 0.8, 5.95],
            // 仙女座υ (Upsilon Andromedae)
            [15.42, -0.48, -41.62, 0.85, 0.85, 0.8, 4.09],
            // HD 209458 - 系外行星凌星
            [3.92, 3.53, -153.88, 0.85, 0.85, 0.8, 7.65],
        ];

        // 生成更多背景恒星 (模拟 HYG 星表的分布特征)
        // 使用对数距离分布 + 随机方向，模拟真实宇宙的恒星分布
        function generateBackgroundStars(count = 8000) {
            const stars = [];
            // 真实恒星颜色分布: 大部分为M/K/G型 (红/橙/黄)，少量F/A/B型 (白/蓝)
            const colorPalette = [
                // [r, g, b, weight] — 权重决定出现概率
                { r: 1.0, g: 0.9, b: 0.8, w: 0.25 },  // G型 (黄)
                { r: 1.0, g: 0.7, b: 0.5, w: 0.30 },  // K型 (橙)
                { r: 0.9, g: 0.5, b: 0.3, w: 0.20 },  // M型 (红)
                { r: 0.95, g: 0.95, b: 1.0, w: 0.15 }, // A型 (白)
                { r: 0.85, g: 0.85, b: 1.0, w: 0.08 }, // B型 (蓝白)
                { r: 0.7, g: 0.7, b: 1.0, w: 0.02 },   // O型 (蓝)
            ];
            // 计算权重总和
            const totalW = colorPalette.reduce((s, c) => s + c.w, 0);

            for (let i = 0; i < count; i++) {
                // 距离: 对数分布，大部分在 20-500 ly 之间，少量更远
                const d = 5 + Math.pow(Math.random(), 1.8) * 800;
                // 方向: 均匀分布在球面上
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = d * Math.sin(phi) * Math.cos(theta);
                const y = d * Math.cos(phi);
                const z = d * Math.sin(phi) * Math.sin(theta);

                // 随机选择颜色
                let rand = Math.random() * totalW;
                let chosen = colorPalette[0];
                for (const c of colorPalette) {
                    rand -= c.w;
                    if (rand <= 0) { chosen = c; break; }
                }
                // 加入随机变化
                const r = Math.max(0.2, Math.min(1, chosen.r + (Math.random() - 0.5) * 0.15));
                const g = Math.max(0.2, Math.min(1, chosen.g + (Math.random() - 0.5) * 0.15));
                const b = Math.max(0.2, Math.min(1, chosen.b + (Math.random() - 0.5) * 0.15));

                // 视星等: 根据距离和亮度估算，大部分较暗
                const mag = 4 + Math.random() * 8;
                stars.push([x, y, z, r, g, b, mag]);
            }
            return stars;
        }

        // 合并真实近邻星和背景星
        const backgroundStars = generateBackgroundStars(8500);
        const allStars = [...STAR_DATA, ...backgroundStars];

        // 更新UI显示恒星数量
        document.getElementById('starCount').textContent = `✦ ${allStars.length.toLocaleString()} 颗恒星`;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. 构建恒星系统
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createStarField() {
            const count = allStars.length;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const [x, y, z, r, g, b, mag] = allStars[i];
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
                colors[i*3] = r;
                colors[i*3+1] = g;
                colors[i*3+2] = b;

                // 大小基于视星等: 越亮越大
                const brightness = Math.pow(10, -mag / 5);
                sizes[i] = 0.015 + brightness * 0.35;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            return new THREE.Points(geom, mat);
        }

        const starField = createStarField();
        scene.add(starField);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. 银河背景 (极淡的银河光晕)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createMilkyWayGlow() {
            const count = 3000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                // 分布在银盘平面附近 (y轴扁平)
                const r = 50 + Math.random() * 350;
                const theta = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 15 * (1 - r / 400);
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                const brightness = 0.05 + Math.random() * 0.1;
                colors[i*3] = 0.7 * brightness;
                colors[i*3+1] = 0.6 * brightness;
                colors[i*3+2] = 0.8 * brightness;
                sizes[i] = 0.3 + Math.random() * 0.8;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.6,
                map: starTex,
                vertexColors: true,
                transparent: true,
                opacity: 0.04,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            return new THREE.Points(geom, mat);
        }

        scene.add(createMilkyWayGlow());

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. 键盘控制
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = true;
            if (k === 'shift') keys.shift = true;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 's' || k === 'a' || k === 'd') keys[k] = false;
            if (k === 'shift') keys.shift = false;
            if (['w','s','a','d','shift',' '].includes(k)) e.preventDefault();
        });
        window.addEventListener('blur', () => {
            keys.w = keys.s = keys.a = keys.d = keys.shift = false;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. 动画循环
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const speedBase = 0.12;
        let velocity = new THREE.Vector3(0, 0, 0);
        const coordsEl = document.getElementById('coords');

        function animate() {
            requestAnimationFrame(animate);

            // 惯性移动
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let speed = speedBase * (keys.shift ? 2.2 : 1.0);
            let moveX = 0, moveZ = 0;
            if (keys.w) moveZ += speed;
            if (keys.s) moveZ -= speed;
            if (keys.a) moveX -= speed * 0.7;
            if (keys.d) moveX += speed * 0.7;

            const target = new THREE.Vector3();
            if (moveZ !== 0) target.add(forward.clone().multiplyScalar(moveZ));
            if (moveX !== 0) target.add(right.clone().multiplyScalar(moveX));

            velocity.lerp(target, 0.10);
            if (velocity.length() < 0.001 && target.length() === 0) velocity.set(0,0,0);

            if (velocity.length() > 0.0001) {
                camera.position.add(velocity);
                controls.target.add(velocity);
            }

            controls.update();

            const p = camera.position;
            coordsEl.textContent = `${p.x.toFixed(1)} · ${p.y.toFixed(1)} · ${p.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        animate();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. 响应式
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌌 真实宇宙星图已加载 — 基于 HYG 星表数据');
        console.log(`   ✦ ${allStars.length} 颗恒星`);
        console.log('   📍 您正位于太阳系中心 (0, 0, 0)');
    </script>
</body>
</html>

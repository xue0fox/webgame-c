<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏入口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
      text-align: center;
    }

    .game-list {
      width: 100%;
      max-width: 640px;
      display: grid;
      gap: 16px;
    }

    .game-card {
      display: block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }

    .game-card:hover,
    .game-card:focus {
      transform: translateY(-2px);
      border-color: #60a5fa;
      background: #27354f;
      outline: none;
    }

    .game-card h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .game-card span {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      .game-card {
        padding: 16px 20px;
      }

      .game-card h2 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <h1>网页游戏入口</h1>
  <p class="subtitle">选择一款游戏开始</p>
  <div class="game-list" id="gameList"></div>

  <script>
    const gameList = document.getElementById('gameList');

    fetch('.')
      .then(res => res.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));
        const games = links
          .map(a => a.getAttribute('href'))
          .filter(href => href && href.endsWith('.html') && href.toLowerCase() !== 'index.html')
          .filter((value, index, self) => self.indexOf(value) === index);

        if (games.length === 0) {
          gameList.innerHTML = '<p class="empty">暂无其他游戏页面</p>';
          return;
        }

        gameList.innerHTML = games.map(href => {
          const name = href.replace(/\.html$/i, '');
          return `
            <a class="game-card" href="${href}">
              <h2>${name}</h2>
              <span>点击开始游戏</span>
            </a>
          `;
        }).join('');
      })
      .catch(() => {
        gameList.innerHTML = '<p class="empty">加载游戏列表失败</p>';
      });
  </script>
</body>
</html>

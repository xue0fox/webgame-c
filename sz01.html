<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
   <title>数字速击 · 极限模式</title>
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           -webkit-tap-highlight-color: transparent;
           touch-action: manipulation;
       }

       body {
           background: #0a0a12;
           color: #fff;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           height: 100vh;
           height: 100dvh;
           overflow: hidden;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
       }

       /* 全屏紧迫感特效层 */
       .urgency-overlay {
           position: fixed;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           pointer-events: none;
           z-index: 5;
           opacity: 0;
           transition: opacity 0.15s;
           box-shadow: inset 0 0 0 0 rgba(255, 30, 30, 0);
       }

       .urgency-overlay.active {
           opacity: 1;
           animation: urgencyPulse 0.4s infinite alternate;
       }

       .urgency-overlay.critical {
           opacity: 1;
           animation: urgencyPulseFast 0.2s infinite alternate, screenShake 0.3s infinite;
       }

       @keyframes urgencyPulse {
           0% { box-shadow: inset 0 0 60px rgba(255, 40, 40, 0.15); }
           100% { box-shadow: inset 0 0 120px rgba(255, 40, 40, 0.35); }
       }

       @keyframes urgencyPulseFast {
           0% { box-shadow: inset 0 0 80px rgba(255, 20, 20, 0.25), inset 0 0 0 4px rgba(255, 50, 50, 0.3); }
           100% { box-shadow: inset 0 0 160px rgba(255, 20, 20, 0.55), inset 0 0 0 8px rgba(255, 50, 50, 0.6); }
       }

       @keyframes screenShake {
           0%, 100% { transform: translate(0, 0); }
           25% { transform: translate(1px, 1px); }
           50% { transform: translate(-1px, -1px); }
           75% { transform: translate(1px, -1px); }
       }

       /* 心跳文字 */
       .heartbeat-text {
           position: fixed;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%);
           font-size: 120px;
           font-weight: 900;
           color: rgba(255, 40, 40, 0.08);
           pointer-events: none;
           z-index: 4;
           opacity: 0;
           transition: opacity 0.2s;
           letter-spacing: 8px;
       }

       .heartbeat-text.active {
           opacity: 1;
           animation: heartbeat 0.6s infinite;
       }

       .heartbeat-text.critical {
           opacity: 1;
           animation: heartbeatFast 0.3s infinite;
           color: rgba(255, 30, 30, 0.15);
       }

       @keyframes heartbeat {
           0%, 100% { transform: translate(-50%, -50%) scale(1); }
           50% { transform: translate(-50%, -50%) scale(1.08); }
       }

       @keyframes heartbeatFast {
           0%, 100% { transform: translate(-50%, -50%) scale(1); }
           50% { transform: translate(-50%, -50%) scale(1.15); }
       }

       .game-container {
           width: 100%;
           max-width: 420px;
           padding: 10px 16px;
           display: flex;
           flex-direction: column;
           height: 100%;
           position: relative;
           z-index: 10;
       }

       .status-bar {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 12px 8px;
           background: rgba(255,255,255,0.05);
           border-radius: 16px;
           margin-bottom: 12px;
           backdrop-filter: blur(10px);
           border: 1px solid rgba(255,255,255,0.08);
       }

       .stat-item {
           text-align: center;
           flex: 1;
       }

       .stat-label {
           font-size: 11px;
           color: #666;
           margin-bottom: 4px;
           letter-spacing: 1px;
       }

       .stat-value {
           font-size: 24px;
           font-weight: 800;
           color: #e94560;
           text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
       }

       .stat-value.target {
           color: #00d9ff;
           text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
       }

       .stat-value.score {
           color: #f9c74f;
           text-shadow: 0 0 10px rgba(249, 199, 79, 0.3);
       }

       .timer-container {
           width: 100%;
           height: 6px;
           background: rgba(255,255,255,0.08);
           border-radius: 3px;
           margin-bottom: 16px;
           overflow: hidden;
           position: relative;
       }

       .timer-bar {
           height: 100%;
           background: linear-gradient(90deg, #00d9ff, #00ff88);
           border-radius: 3px;
           transition: width 0.05s linear;
           box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
       }

       .timer-bar.danger {
           background: linear-gradient(90deg, #ff4444, #ff0000);
           box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
           animation: barFlicker 0.1s infinite alternate;
       }

       @keyframes barFlicker {
           0% { opacity: 1; }
           100% { opacity: 0.7; }
       }

       .grid-container {
           display: grid;
           grid-template-columns: repeat(5, 1fr);
           grid-template-rows: repeat(6, 1fr);
           gap: 8px;
           flex: 1;
           min-height: 0;
           padding-bottom: 8px;
       }

       .cell {
           background: rgba(255,255,255,0.04);
           border: 1px solid rgba(255,255,255,0.08);
           border-radius: 12px;
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 20px;
           font-weight: 700;
           color: #b0b8d1;
           cursor: pointer;
           transition: all 0.12s ease;
           user-select: none;
           position: relative;
           overflow: hidden;
       }

       .cell::before {
           content: '';
           position: absolute;
           top: 0; left: 0; right: 0; bottom: 0;
           background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%);
           opacity: 0;
           transition: opacity 0.2s;
       }

       .cell:active {
           transform: scale(0.92);
           background: rgba(255,255,255,0.1);
       }

       .cell:active::before {
           opacity: 1;
       }

       .cell.correct {
           animation: correctPop 0.25s ease;
           background: rgba(0, 217, 255, 0.15);
           border-color: rgba(0, 217, 255, 0.4);
           color: #00d9ff;
       }

       .cell.wrong {
           animation: wrongShake 0.35s ease;
           background: rgba(233, 69, 96, 0.15);
           border-color: rgba(233, 69, 96, 0.4);
       }

       @keyframes correctPop {
           0% { transform: scale(1); }
           50% { transform: scale(1.12); }
           100% { transform: scale(1); }
       }

       @keyframes wrongShake {
           0%, 100% { transform: translateX(0); }
           20% { transform: translateX(-5px); }
           40% { transform: translateX(5px); }
           60% { transform: translateX(-3px); }
           80% { transform: translateX(3px); }
       }

       @keyframes appear {
           0% { transform: scale(0) rotate(-8deg); opacity: 0; }
           100% { transform: scale(1) rotate(0deg); opacity: 1; }
       }

       .cell.new-number {
           animation: appear 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
       }

       .overlay {
           position: fixed;
           top: 0; left: 0; right: 0; bottom: 0;
           background: rgba(5, 5, 10, 0.95);
           backdrop-filter: blur(16px);
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           z-index: 100;
           padding: 24px;
           text-align: center;
       }

       .overlay.hidden {
           display: none;
       }

       .overlay-title {
           font-size: 32px;
           font-weight: 800;
           margin-bottom: 8px;
           background: linear-gradient(135deg, #00d9ff, #00ff88);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
       }

       .overlay-subtitle {
           font-size: 15px;
           color: #666;
           margin-bottom: 32px;
           line-height: 1.6;
           max-width: 300px;
       }

       .final-score {
           font-size: 80px;
           font-weight: 900;
           color: #f9c74f;
           margin: 12px 0;
           text-shadow: 0 0 30px rgba(249, 199, 79, 0.3);
           line-height: 1;
       }

       .final-score-label {
           font-size: 14px;
           color: #666;
           margin-bottom: 32px;
       }

       .btn {
           background: linear-gradient(135deg, #e94560, #ff6b6b);
           color: white;
           border: none;
           padding: 16px 48px;
           font-size: 18px;
           font-weight: 700;
           border-radius: 50px;
           cursor: pointer;
           transition: all 0.2s;
           box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
           letter-spacing: 2px;
       }

       .btn:active {
           transform: scale(0.95);
           box-shadow: 0 2px 10px rgba(233, 69, 96, 0.3);
       }

       .btn-secondary {
           background: transparent;
           border: 2px solid rgba(255,255,255,0.15);
           margin-top: 12px;
           box-shadow: none;
           font-size: 14px;
           padding: 12px 32px;
       }

       .btn-secondary:active {
           background: rgba(255,255,255,0.05);
       }

       .combo-text {
           position: fixed;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%);
           font-size: 48px;
           font-weight: 900;
           color: #f9c74f;
           pointer-events: none;
           opacity: 0;
           z-index: 50;
           text-shadow: 0 0 20px rgba(249, 199, 79, 0.5);
       }

       .combo-text.show {
           animation: comboAnim 0.8s ease forwards;
       }

       @keyframes comboAnim {
           0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
           20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
           100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
       }

       .rules {
           text-align: left;
           background: rgba(255,255,255,0.03);
           border-radius: 12px;
           padding: 16px;
           margin-bottom: 24px;
           font-size: 13px;
           color: #888;
           line-height: 1.8;
           border: 1px solid rgba(255,255,255,0.06);
       }

       .rules strong {
           color: #bbb;
       }

       .rules li {
           margin-left: 16px;
           margin-bottom: 4px;
       }
   </style>
<base target="_blank">
</head>
<body>

<!-- 全屏紧迫感特效层 -->
<div class="urgency-overlay" id="urgencyOverlay"></div>
<div class="heartbeat-text" id="heartbeatText">HURRY</div>

<div class="game-container" id="gameContainer" style="display:none;">
   <div class="status-bar">
       <div class="stat-item">
           <div class="stat-label">当前目标</div>
           <div class="stat-value target" id="targetDisplay">1</div>
       </div>
       <div class="stat-item">
           <div class="stat-label">最高记录</div>
           <div class="stat-value score" id="scoreDisplay">0</div>
       </div>
       <div class="stat-item">
           <div class="stat-label">剩余时间</div>
           <div class="stat-value" id="timeDisplay">5.0s</div>
       </div>
   </div>

   <div class="timer-container">
       <div class="timer-bar" id="timerBar"></div>
   </div>

   <div class="grid-container" id="grid"></div>
</div>

<div class="combo-text" id="comboText"></div>

<!-- 开始界面 -->
<div class="overlay" id="startOverlay">
   <div class="overlay-title">数字速击</div>
   <div class="overlay-subtitle">在倒计时结束前，按顺序找出下一个数字</div>
   <div class="rules">
       <strong>极限模式规则：</strong>
       <ul style="list-style: none; padding: 0; margin-top: 8px;">
           <li>• 30个格子随机排列数字，从 1 开始按顺序点击</li>
           <li>• <strong>没有提示</strong>，全靠眼力在格子中寻找目标</li>
           <li>• 每点击正确一次，该格子会更新为更大的新数字</li>
           <li>• 所有数字全局唯一，已出现过的不会重复</li>
           <li>• 你有 <strong>5秒</strong> 时间寻找并点击下一个数字</li>
           <li>• 时间越少，屏幕越红，紧迫感越强</li>
           <li>• 超时未点击则游戏结束，统计最终数字</li>
       </ul>
   </div>
   <button class="btn" onclick="startGame()">开始挑战</button>
</div>

<!-- 结束界面 -->
<div class="overlay hidden" id="endOverlay">
   <div class="overlay-title" style="font-size: 24px; margin-bottom: 4px;">时间到！</div>
   <div class="final-score-label">你达到了数字</div>
   <div class="final-score" id="finalScore">0</div>
   <div class="final-score-label" id="finalComment">继续加油！</div>
   <button class="btn" onclick="startGame()">再来一局</button>
   <button class="btn btn-secondary" onclick="showStart()">返回主页</button>
</div>

<script>
   const TOTAL_CELLS = 30;
   const TIME_LIMIT = 5000;
   
   let cells = [];
   let currentTarget = 1;
   let nextNumber = 31;
   let timerStart = 0;
   let timerId = null;
   let isPlaying = false;
   let bestScore = localStorage.getItem('numberTapBest') || 0;
   let combo = 0;

   const gridEl = document.getElementById('grid');
   const targetDisplay = document.getElementById('targetDisplay');
   const scoreDisplay = document.getElementById('scoreDisplay');
   const timeDisplay = document.getElementById('timeDisplay');
   const timerBar = document.getElementById('timerBar');
   const startOverlay = document.getElementById('startOverlay');
   const endOverlay = document.getElementById('endOverlay');
   const finalScore = document.getElementById('finalScore');
   const finalComment = document.getElementById('finalComment');
   const comboText = document.getElementById('comboText');
   const gameContainer = document.getElementById('gameContainer');
   const urgencyOverlay = document.getElementById('urgencyOverlay');
   const heartbeatText = document.getElementById('heartbeatText');

   function initGrid() {
       gridEl.innerHTML = '';
       for (let i = 0; i < TOTAL_CELLS; i++) {
           const cell = document.createElement('div');
           cell.className = 'cell';
           cell.dataset.index = i;
           cell.addEventListener('click', () => handleCellClick(i));
           gridEl.appendChild(cell);
       }
   }

   function shuffle(arr) {
       const a = [...arr];
       for (let i = a.length - 1; i > 0; i--) {
           const j = Math.floor(Math.random() * (i + 1));
           [a[i], a[j]] = [a[j], a[i]];
       }
       return a;
   }

   function startGame() {
       startOverlay.classList.add('hidden');
       endOverlay.classList.add('hidden');
       gameContainer.style.display = 'flex';
       
       currentTarget = 1;
       nextNumber = TOTAL_CELLS + 1;
       combo = 0;
       isPlaying = true;
       
       urgencyOverlay.className = 'urgency-overlay';
       heartbeatText.className = 'heartbeat-text';
       
       const initialNumbers = shuffle(Array.from({length: TOTAL_CELLS}, (_, i) => i + 1));
       cells = [...initialNumbers];
       
       updateDisplay();
       renderGrid();
       startTimer();
   }

   function renderGrid() {
       const cellEls = gridEl.querySelectorAll('.cell');
       cellEls.forEach((el, i) => {
           el.textContent = cells[i];
           el.className = 'cell';
       });
   }

   function handleCellClick(index) {
       if (!isPlaying) return;
       
       const clickedNumber = cells[index];
       const cellEl = gridEl.children[index];
       
       if (clickedNumber === currentTarget) {
           combo++;
           showCombo();
           
           cells[index] = nextNumber++;
           currentTarget++;
           
           cellEl.classList.add('correct');
           cellEl.classList.add('new-number');
           setTimeout(() => {
               cellEl.classList.remove('correct');
               cellEl.classList.remove('new-number');
           }, 300);
           
           updateDisplay();
           renderGrid();
           startTimer();
       } else {
           combo = 0;
           cellEl.classList.add('wrong');
           setTimeout(() => cellEl.classList.remove('wrong'), 400);
       }
   }

   function showCombo() {
       if (combo >= 5 && combo % 5 === 0) {
           comboText.textContent = `${combo} 连击!`;
           comboText.classList.remove('show');
           void comboText.offsetWidth;
           comboText.classList.add('show');
       }
   }

   function updateDisplay() {
       targetDisplay.textContent = currentTarget;
       scoreDisplay.textContent = Math.max(bestScore, currentTarget - 1);
       
       const reached = currentTarget - 1;
       if (reached > bestScore) {
           bestScore = reached;
           localStorage.setItem('numberTapBest', bestScore);
       }
   }

   function startTimer() {
       if (timerId) cancelAnimationFrame(timerId);
       timerStart = performance.now();
       urgencyOverlay.className = 'urgency-overlay';
       heartbeatText.className = 'heartbeat-text';
       timerBar.classList.remove('danger');
       tick();
   }

   function tick() {
       if (!isPlaying) return;
       
       const elapsed = performance.now() - timerStart;
       const remaining = Math.max(0, TIME_LIMIT - elapsed);
       const progress = remaining / TIME_LIMIT;
       
       timerBar.style.width = `${progress * 100}%`;
       timeDisplay.textContent = `${(remaining / 1000).toFixed(1)}s`;
       
       if (progress < 0.2) {
           urgencyOverlay.className = 'urgency-overlay critical';
           heartbeatText.className = 'heartbeat-text critical';
           heartbeatText.textContent = Math.ceil(remaining / 1000);
           timerBar.classList.add('danger');
       } else if (progress < 0.5) {
           urgencyOverlay.className = 'urgency-overlay active';
           heartbeatText.className = 'heartbeat-text active';
           heartbeatText.textContent = 'HURRY';
           timerBar.classList.remove('danger');
       } else {
           urgencyOverlay.className = 'urgency-overlay';
           heartbeatText.className = 'heartbeat-text';
           timerBar.classList.remove('danger');
       }
       
       if (remaining <= 0) {
           gameOver();
       } else {
           timerId = requestAnimationFrame(tick);
       }
   }

   function gameOver() {
       isPlaying = false;
       if (timerId) cancelAnimationFrame(timerId);
       
       urgencyOverlay.className = 'urgency-overlay';
       heartbeatText.className = 'heartbeat-text';
       
       const final = currentTarget - 1;
       finalScore.textContent = final;
       
       if (final < 30) finalComment.textContent = "眼疾手快，再试一次！";
       else if (final < 50) finalComment.textContent = "不错不错，反应很快！";
       else if (final < 80) finalComment.textContent = "太厉害了，高手！";
       else if (final < 120) finalComment.textContent = "惊人的速度，大神！";
       else finalComment.textContent = "超越极限，你是传说！";
       
       endOverlay.classList.remove('hidden');
   }

   function showStart() {
       endOverlay.classList.add('hidden');
       startOverlay.classList.remove('hidden');
       gameContainer.style.display = 'none';
   }

   initGrid();
   scoreDisplay.textContent = bestScore;

   document.addEventListener('touchstart', function(e) {
       if (e.touches.length > 1) e.preventDefault();
   }, { passive: false });
   
   let lastTouchEnd = 0;
   document.addEventListener('touchend', function(e) {
       const now = Date.now();
       if (now - lastTouchEnd <= 300) e.preventDefault();
       lastTouchEnd = now;
   }, { passive: false });
</script>

</body>
</html>
